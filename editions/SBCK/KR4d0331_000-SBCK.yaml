body:
  text: 所南翁一百二十圗詩集自序昔嘗序湯西樓先生壮逰集云天地之靈氣為人人之靈氣為心心之靈氣為文文之靈氣為詩盖詩者古今天地間之靈物也吾生也􅁳頑其不靈于詩不靈于文不靈于心不靈于人也久矣棄物若然者􅀌􅀌枯枯迂迂踈踈是誠不靈不然也以其不然不靈也凢有求皆不作絶交㳺絶著作絶倡和漸絶諸絶以了殘妄爾今或遇圗而作或遇事而作而或者又欲俱圗之胡然乎乃然彼不然然而然恣不絶其絶而絶于不絶以無作作其所不作􅀅欲靈夫不靈之靈以為靈其靈靈乎其不靈靈乎此其所以滿目青山緑水垂咲于無窮無窮無窮也耶
