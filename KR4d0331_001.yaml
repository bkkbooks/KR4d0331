body:
  text: 山村仇逺仁近選爛柯山春風萬古洞門開塵世興亡是幾囘碁局至今無處覔樵人于此遇仙来飛梁横跨丹虹影絶頂平鋪白玉堆天下紛紛無好著斜陽下嶺共徘徊卜居久欲謀歸力不任浮雲踪跡謾巣林功名未入屠龍手貧賤常懐買寉心月下開門㣲雨過樓頭聞笛二更㴱世間萬事俱陳迹空倚西風閱古今自黄山還途中作屈指還京十日程每逢歇處問邨名春沙脉脉溪𥘉漲夜雨垂垂曉又晴山下有人傳虎出店中炊飯見牛鳴天涯行客無寕日不及田家業在耕謁岳王墳我来拜謁岳王墳松柏蒼蒼上宿雲臣子報君終一死權奸賣國欲中分鷹揚當日誰䏻及鴈呌中原不可聞石馬石人山寂寂英䧺于此憶将軍次照晦巖韻便騎老虎不須鞍忍辱仙人出宰官入内講經千佛現跏趺對御六龍寒指頭有月娑羅冷舌上懸河海水乾聖主賜衣漫大地西方國土未為寛再登南樓客中重上倚層臺天濶雲收八面開鴈帯岳陽秋曉過浪涵巴峡影西来諸營種桞今何在老子登樓得幾囘自是江山䧺壮處興亡不必問寒灰思耕江湖漸老身山澤夲来心經濟不敢問耕耘猶可尋一頃半頃許三更二更㴱親朋相接近雞酒開塵襟登荆南城樓因為古荆州翻成一叚愁孟嘉曽落㡌王粲此登樓唐鄧通㐮路沱潜並漢流太平官府盛昔日欠来逰宿虎丘到晚歸不去因而此宿休雲㴱千古寺月冷一天秋崖裂池如束天虗塔欲浮最宜𥘉日上髙處看烟收宿洞霄山中入山時八月嵐氣似深冬岩洞生風雨窠巣落檜松山中九重鎖月下一聲鐘警省非人世今秋淂異逢喜静素来嫌僻静今漸與相安師友凋零盡年時出處難春風雙屐暖夜雨一燈寒洙泗曾顔軰何曾作好官餘杭界早發早發促程期籃輿帯月低山中如白晝斗下渡清溪群動霜𥘉落四隣雞未啼惟聞兵逓舖星急過淮西餘杭道上五年兹路上頻徃又頻還歲月孤松老風霜苦竹班溪流天目水雲出洞霄山馬上因閒眺蜉蝣宇宙間病後漸嬾說功名修真喜道經凄凉秋聼雨空濶夜觀星有病色先見無心夢最靈堦前風葉響還又感飄零歸去好歸去豈不好平田帯淺林春猿鳴雪澗晴日上雲岑世久無鳴犢時當學展禽吾生今老矣梁父豈能吟送友人之淮積得讀書身從教此道貧逢秋為逺客知已是何人天下方多事西風至不仁但于登眺處杯酒莫辤頻吴江三髙祠堂吾拜三髙堂三髙在何許香爐上蒼苔破屋落大音堕雨石泐水弹痕地洞龍潜處清魂汗漫逰芳名垂萬古吴江太湖龍王殿吾謁龍王殿龍王在何許太湖三萬頃水族龍為主離離明月宫渺渺寒烟渚天下有旱蝗吾亦䏻行雨荆南别賈制書東歸来時秋雨滿江楼歸日春風度客舟囘首荆南天一角月明吹笛下揚州送友人之鄂湖海聲名落搢紳由江而鄂遡鱗鱗煩君黄寉楼頭看天下英䧺有㡬人晚春即事輕寒時莭牡丹開葉底青青又見梅門外数枝楊桞薄一春鶯燕不曾来荆江口望見君山荆江江口望漫漫一白無邊夕照寒只是青雲浮水上教人錯認作山看繁昌江邊見两獺祭魚人立而拜寒食清明在客途片㠶飄泊老無廬松楸方念無人掃忽見江邊獺祭魚虎丘尹和靖書院示開講從前聼者少是日聼者衆和靖書堂八面開新分半席在山隈若無人聼都歸去傳語生公借石来為九華王此山賦寕石此山有寕石我玉之詩我謂此山天作石石不是石人不識千年野寉獨見君石上採芝石上喫関山月霜下月色白沙飛月色黄征人此暴露未有不辛傷滿野髑髅骨依山魚鴈行祁連與瀚海惨淡更蒼茫所繫兮何星採桑曲晴採桑雨採桑田頭陌上家家忙去年飬蚕十分熟蚕姑只着麻衣裳樵歌三首上山斸山山丁登下山嵌山山􅏢層秋殘日暮歸来晚茅􅉉洗脚月又明明朝早入芙蓉城入城不識公與卿行歌道上旁無人衣衫藍縷鶉百結與妻索笑妻生嗔那知不是朱買臣山㘬築着牧牛児白石鑿鑿蒙茸披繆公無人寗戚死獨吹觱栗誰淂知不如採樵同路歸讀馮道傳西山有薇二子採之二子竟死薇不療飢匪悪周粟食不下咽君臣義重彼蒼者天爾道何人数主一身有何顔面冠冕搢紳喬固諸賢寕死道邊曺操不帝清議凛然短歌行覧鏡摩挱歲月蹉跎道長命窄憂慮如何何以消除非酒莫祛醉来不見醒復如𥘉跖蹻鏘鏘孔孟皇皇何非何是孰劣孰强日出杲兮月出皓兮無風無雨可以同携人生朝露保不及暮青青纍纍皆是墳墓天機轉深轉用勞心不如坦蕩驅遣光隂飲馬長城窟飲馬長城窟下見征人骨長城窟雖深見骨不見心誰知征人心怨殺秦至今北邊風打山草地荒漫漫五月方見青七月霜便寒古来無井飲賫帯糧盡乾自従征人掘此窟戎馬飲之如飛翰朝呷一口水暮破千重関秦皇極是無道理長城萬里誰能比鄂州南楼湻祐六年冬十月我来獨自上南楼曉霧江山都不見霧收日出城東頭照見漢陽樹照見鸚鵡洲浪濤江漢出岷峡洞庭雲夢天共流大船如龍􅐈寒碧小船如葉飛洪溝費禕霞珮跨黄寉洞賔玉笛横清秋泬寥寥兀不可状開闔風雨晴烟浮空中一一都照見照見今来古往絲粟無限愁夜郎逐客心膽大醉欲搥碎醒又休此山此水長不老英䧺消盡山水留何當大雪夜明月摩挱老眼看九州春風吹雪變紅綠牛羊𬒳野邊無憂洞庭君山辭時附戍蜀船行山為君兮水為臣水為臣兮象為兵君有定位兮兵無定形知山知水兮知君臣之性情不知師不知比兮又奚知用兵之精余經山之外兮覩山水之杳冥佳氣葱􅓹兮或天香而龍腥烟雲變化兮或狗状而人形風濤洶湧兮或崖立而天平或夕陽兮漁歌或曉霜兮鐘聲或雪下兮雁呌或夜半兮鼍鳴或仙人張樂兮霞珮之軿軿或神丁從駕兮車騎之轔轔冬寒春暖兮湖草㡬畨之青青今来古徃兮人物㡬代之廢興嗟余行役兮顧鬂影之星星無由登山臨水兮與鷗鷺盟北風吹𬒮兮又将之荆徘徊不忍去兮聊以歌而行辭弔冨沙梨山大王祠唐詩人李頻也梨山之陽兮有廟煌煌州人祭享兮釃酒椎羊王之未死兮守土此方王之既死兮州人不忘建山之峭兮建水之長建秔之粲兮建茗之香州人禱福兮王錫吉祥魂之来歆兮靈旂央央蛇虎遁伏兮松桂芬芳梨花燁燁兮王之甘棠自古詩人兮憔悴異常王之爵位兮何嗇于唐昔駕五馬兮今衣衮裳詩人之窮兮詩人之昌招魂酹翁賔暘君之在世帝勅下君之謝世帝勅囬魂之為變性原返氣之為物情夲開於戲龍兮鳯兮神氣盛噫嘻鬼兮歸兮大塊埃身可朽名不可朽骨可灰神不可灰采石捉月李白非醉耒陽避水子美非灾長孫王吉命不夭玉川老子詩不俳新城羅隱大竒特錢塘潘閬終崔嵬隂兮魄兮曷往陽兮魂兮曷来君其歸来故交寥落更散漫君其歸來帝城絢爛可徘徊君其歸来東西南北不可去君其歸来春秋霜露令人哀花之明吾無與笑葉之隕吾寔若摧曉猿嘯吾聞淚堕宵寉立吾見心猜玉泉其清可鍳西湖其甘可杯孤山暖梅香可嗅花翁葬薦菊之隈君其歸来可伴逋仙之梅去此又奚之哉所南翁一百二十圗詩集黄帝洞庭張樂圗天水相涵萬象清咸池真樂妙無根大音豈在九霄外有意聼時却不聞堯民擊壌圗百姓相忘堯帝春耕田鑿井淡無情只今正是何年月日日月從東向生巣父洗耳圗萬事喧喧雜響中細参巣父意無窮須還半掬溪邊水方始教君耳不聾許由棄瓢圗天下揺頭不肯為恰如瓢掛老松枝許由不在箕山在千古髙風屬阿誰吕望垂釣圗八十翁翁心尚孩渭濵痴坐㺯徘徊當𥘉若是逃名者誰要文王上釣来夷齊西山圗扣馬痴心諫不休既拚一死百無憂因何留淂首陽在只說商家不說周老子度関圗𬗋氣東来壓萬山老聃吐舌咲開顔青牛車外天風濶揺動當年函谷関紀昌貫蝨悟射圗從来絶藝欲超倫何止彎弓用意深覰破㣲塵㣲極處忽開大地見紅心鍾子期聼琴圗一契髙山流水心形神空静两忘情自非父母所生耳聼見伯牙聲外聲伯牙絶弦圗終不求人更賞音只當仰面看山林一㕠閒手無聊頼滿地斜陽是此心榮啟期三樂圗生死悠悠付老天啟期三樂亦超然此身不淂為男子空活人間九十年伯樂相馬圗冀地羣中不可留如龍赱地絶無儔何勞伯樂一相顧抹過西風数百州荘子夢蝶圗素来夣覺両俱空開眼還如闔眼同蝶是荘周周是蝶百花無口罵春風輪扁諫讀書圗輪扁釋椎開口諫國君據坐展書開古人糟粕終枯淡誰醉天然滋味来卞和泣玉圗大璞中函天地精卞和抱出愈分明一畨刖足一畨哭哭殺世人無眼睛寗戚飯牛圗斯人豈是飯牛者浩歎空懐扣角悲説到漫漫長夜處南山白石也攅眉孺子濯纓圗秋影澄澄湛碧波濯纓人逺意如何臨風歌罷飄然去賣㺯滄浪清處多葉公畫龍圗神物難傳變化時葉公眼外泄天機一從親見真頭角滿手風雲雷電飛孟嘗君度関圗狐白裘邊事若難孟嘗門下亦何顔若無意智翻身去半夜焉能度此関屈原九歌圗椘人念念愛清湘苦憶九歌頻㫁膓只道此中皆椘國還于何處拜東皇屈原餐菊圗誰念三閭久陸沉飽霜猶自傲秋深年年吞吐說不淂一見黄花一苦心范蠡扁舟圗烏喙無情奈若何功成只合理漁蓑躍身吴越興亡外一舸江湖風月多毛遂脫頴圗十九人中不数君當機勇辯獨超羣若非末後脫頴出多淂英風潑椘雲魯欹器圗此心安分即逍遥無欲何愁外境揺纔有秋毫失中正一杯水亦不能消列子竊鈇圗宇宙茫茫盡坦途莫将淂失自相辜胸中若有一些子大地山河俱竊鈇秋胡子圗即歸猶未到家中艶語勾春妾面紅尀耐相逢不相識梅花那肯戀東風西施捧心圗蕩盡吴王醉後春化為顰咲艶精神當胸一點痛淂别直是妖嬈惱殺人􅌐山老姥磨鐡杵欲作繍針圗欲化龜蛇生聖胎􅌐山㣲意孰䏻猜純鋼一塊都磨盡不信􅊏毫眼不開秦女吹簫圗㺯玉飄飄仙女姿鳯凰低舞久相期簘中應有别一曲飛出青天影外吹湘靈鼓瑟圗霧質烟姿雪月心凌波無迹似多情試聼誰在湘江上髣髴秋風曲数聲毛女圗六國傾城輦入秦深花宻桞鏁青春神仙自有長生路豈是阿房宫裏人徐福採藥圗仙藥長生不易求仙山可在海東頭祖龍滅盡諸侯後徐福却来嬴一籌青門種瓜圗百二山河勢莫當咸陽誰付與髙皇盡嫌嬴政鮑魚臭争慕邵平瓜圃香漢髙祖将韓信圗先入関中淂計多彭城未是漢山河不操擒縦英䧺手韓信何由肯倒戈張子房遇黄石公圗三度橋邊伺老仙始将兵法盡相傳不知躡足此一計還出書中苐㡬萹四皓圗曄曄𬗋芝巖石隈避秦有地似蓬萊可憐白髮坐不定又𬒳漢朝呼出来周亞夫細桞營圗細桞營中作略殊寕容直入驟先驅不因一見入門訣文帝何曾識亞夫李廣射石虎圗怪石蹲身草芥中錯疑猛虎噴腥風何消重費将軍力只在當頭一箭功董仲舒不窺園圗西漢諸儒君最醕無人見面意應深三年盡力窺經史一旦看花了古今蘇武牧羊假寐圗十九年間墮渺茫飢来齧雪齒生香一心只夢飛歸國㕠眼何曾看見羊蘇李泣别圗同為武帝一時人忠逆分違感慨深早信子卿歸漢去淚痕滴滴滴黄金司馬相如題柱圗𥘉上昇仙何慷慨重来衣錦頗從容男児意氣當如此透過禹門方是龍張騫乗槎圗牛女宫中事若何親身曾淂上天河逢人莫説支機石漏洩蒼蒼意已多翟公交情圗翟公冷語久逾新漢世交情古亦今不𬒳死生貧賤轉此時方始見人心朱買臣賣柴圗年當五十始荣華覆水難収重歎嗟豈信後来春色别滿柴擔上盡開花二䟽東門祖帳圗昔日賢㢤二大夫東門祖帳耀通衢太平時莭獨先去闔國人知此意無嚴君平垂簾賣卜圗多是垂簾自飬神僅能了日即安貧不離忠孝談玄妙豈是尋常賣卜人皇𥘉平牧羊圗兄弟参商四十春金華山裏問斜曛相逢不是牧羊客白石顢頇冷笑君西王母蟠桃宴圗玄圃筵開物外春萬仙歡咲動精神蟠桃種子今猶在誰是三千年後人嚴子陵垂釣圗新莽紛紛未有涯桐江山水頗為嘉無心偶向一絲上釣淂清風滿漢家袁安卧雪圗飛玉堆寒二丈過杜門僵卧飬天和不愁屋外六花大但覺胸中清氣多髙鳯讀書漂麥圗癖愛詩書苦未休肯将俗事掛心頭等閒痛快語言外那見雨来和麥流張天師飛昇圗玉局曾經拜老君子孫今尚寳玄文要知龍乕山前意但看空中数片雲王粲覆碁圗雅鷺争飛局局殊便生國手亦難圗未曾落子有一着王粲還能覆淂無先主三顧草廬圗抱膝髙吟梁父時卧龍致雨未為遲若無三顧草廬意剖出心肝賣與誰孔明出師表圗一身英氣射光芒北定中原事轉長落淂两萹出師表至今只是漢文章孔明成都八陣圗孔明抱義恥偏安不道中興事業難頼有石頭知落䖏任從人換八門看王祥卧氷圗母病杯羔意未諧觧衣竟欲卧氷開有心直透清波下安淂無魚躍出来王衍舉阿堵物圗口不言錢早不同何湏相試苦相攻今朝叱去阿堵物一室玲瓏分外空竹林七賢圗清談何𥙷晉江山誰與中原了歲寒惟有白雲三四片飛来自向古琅玕王子猷看竹圗秋沁徽之骨亦清翠光如水漾空明只圗一見此君面誰更問人閒姓名王子猷訪戴圗雪夜懐人泛剡溪造門而返是還非不曾相見猶相見滿載清風獨自歸阮籍醉眠酒家圗少婦當壚應怪人陶陶一覺了殘更無情不作如花想夣見醉鄊生月明劉伶荷鍤圗酒國韶光無際涯大人境界絶朋儕生来自有一方地何待醉終纔始埋戴安道破琴圗獨抱洋洋太古心王門何苦欲相尋狂来寕可破琴去不許俗人聞此音畢卓甕間圗酔玉頽來欲化仙一窪和氣藹芳妍終宵自向華胥去吏部何曾甕下眠孫康映雪讀書圗孫康苦志惜居諸雪夜無燈興有餘冷地白光生破屋自然開眼見詩書張翰思􅐜鱸圗名爵雖荣心最苦蒪鱸有味食無厭後来京洛風塵暗轉覺吴淞江水甜孫椘枕流潄石圗孫椘匆匆誤荅時説来頗與事相違枕流潄石翻為妙活弄胸中倒一機庾亮登南樓圗老子情懐頗滑稽登樓恰喜月明時雖然于此興不淺要且諸人知不知周處除三害圗一朝周處奮英豪三害皆除豈惮勞若是不能䧏自已縦屠龍乕不為髙王羲之蘭亭圗猶記蘭亭三月三流觴曲水暢清酣分明一叚永和意好向羲之茟外参桓伊三㺯圗傾盖相逄不問誰知音那肯露心機一聲吹破清秋影驚散閑雲各自飛車武子聚萤讀書圗武子耽書不暫忘練􅌩終夜照凄凉讀来讀去東方白笑殺流萤数點光陸績懐橘遺母圗獨薦霜丸意不安誰供甘㫖侍團圞驀然憶著娘生面萬樹黄金盡喜歡吴隠之飲貪泉圗外物終難換肺腸隠之清介頓生狂便教飲盡貪泉水只覺通身白雪香郝隆曬腹書圗七夕庭中羅綺乾鄰家應是鄙儒冠文章滿腹無人識鋪與青天白日看陶淵明三逕圗老氣蒼寒松樹活閒情幽淡菊花開一條古路無人走還且與人相徃来陶淵明對菊圗彭澤歸来老歲華東籬儘可了生涯誰知秋意凋零後最耐風霜有此花王孝伯痛飲讀離騷圗名士天生磊落才只耽痛飲罄樽罍誰傳一味觧酲法歌㫁離騷眼自開許真君飛昇圗鐡柱遺蹤尚􅌂然五陵後必出群仙當時諶姆說甚麽四十二人都上天孫登長嘯圖碧眼空空照九州阮公不是我同流劃然長嘨誰聼淂獨有蘇門山點頭王烈餐石髓圗五百年方開此山寒光浮暖濕而乾明明正是洪濛髓只恐凢人不肯餐桃源圗長城徭役苦咨嗟澧水偷春隱歲華有耳不聞秦漢事眼前日日賞桃花爛柯圗日出樵柴日落歸㡬年黑白夣紛飛看來直待斧柯爛始悟老仙碁外機延平躍劔圗白晝平津湧似雷盡驚靈物出塵埃倒翻三尺揮空去對舞㕠龍破浪来陶弘景三層樓聼松風圗弘景層樓掉太清萬龍􅐈翠響泠泠此心不出三界看一片秋聲何䖏聼文選閣圗太子奢華能㡬年盡将春夣付荒烟錯聼古調一两拍空嗅斯文数百篇唐明皇逰月宫圗玉仗飛行馭太空湏臾徑到廣寒宫三郎胸次無髙見落眼蟾蜍光影中李靖天瓢圗夣裡騎龍出八荒掃空熱惱作清凉不消數滴天瓢雨净洗娑婆透骨香王勃滕王閣記圗王勃清才俊不禁爛鋪艶錦賞知音空餘髙閣青雲裏誰識落霞秋水心狄仁傑白雲親舎圗駐馬囘頭眺碧空河陽在望去匆匆吾親雖舎白雲下豈出梁公一念中孟浩然歸隱圗明主憐才若賜官奔馳㣲禄負家山狂吟搔首咲瓢雨净洗娑婆透骨香王勃滕王閣記圗王勃清才俊不禁爛鋪艶錦賞知音空餘髙閣青雲裏誰識落霞秋水心狄仁傑白雲親舎圗駐馬囘頭眺碧空河陽在望去匆匆吾親雖舎白雲下豈出梁公一念中孟浩然歸隱圗明主憐才若賜官奔馳㣲禄負家山狂吟搔首咲歸去滿路秋光上醉顔李太白硯靴圗斗酒未乾詩百篇篇篇竒氣赱雲烟自從捧硯脫靴後笑看唐家萬里天杜子美茅屋為秋風所破歌圗雨􅐈風掀地欲沈浣花溪路似難尋数間茅屋苦饒舌説殺少陵憂國心杜子美騎驢圗飯顆山前花正姸飲愁為醉㺯吟顛突然騎過草歸去滿路秋光上醉顔李太白硯靴圗斗酒未乾詩百篇篇篇竒氣赱雲烟自從捧硯脫靴後笑看唐家萬里天杜子美茅屋為秋風所破歌圗雨􅐈風掀地欲沈浣花溪路似難尋数間茅屋苦饒舌説殺少陵憂國心杜子美騎驢圗飯顆山前花正姸飲愁為醉㺯吟顛突然騎過草堂去夢拜杜䳌聲外天子美孔明廟古柏行圗諸葛甘棠歲月深霜皮黛色􅓹沉沉尚垂清䕃蜀國裡一樹風霜千載心韓昌黎祭鰐魚圗朝奏空言暮逺途藍関飛雪漬衣𥚑豈期去國八千里此意猶䏻化鰐魚桞子厚賦寒江釣雪圗空玄影外渺孤舟不與漁翁意思侔萬頃風濤一天雪且看誰觧下金鉤盧仝煎茶圗月團片片吐蒼烟破㡌籠頭手自煎七椀不妨都喫了恣開笑口罵群仙陸龜蒙茶竈茟牀圖笠澤往来無定期煮茶垂釣酔吟詩一船清致終難画不是散人應不知公孫大娘舞劔圗􅊏手生風攪晝寒好花翻影艶清歡試看不犯鋒鋩處舞碎晴空雪一團張果老倒騎驢圗云是堯時丙子生狂踪怪跡恣幽情抝驢面目不須看一任騎来顛倒行張志和漁父圗苕霅春深花滿谿一鈎翻動碧琉璃簑衣篛笠儘有意不到斜風細雨知藍采和踏踏歌圗踏踏歌中天地開紅顔春樹莫相催藍𫀆轉破轉竒特别看仙人舞一囬鍾吕傳道圗鍾吕喃喃手指空應談玄牝妙無窮都来造化只半句不在丹經文字中吕洞賔賣墨圗鍊就玄玄一塊金朝磨暮寫愈精神先生此墨初無價不識誰為買墨人沈東老遇吕洞賔圗東老忘懐相遇時洞賔爛醉以為期聊題不涉毫端句早𬒳石榴皮淂知巴山橘中圗剖破渾淪一殻寛二仙飛去已雲端須知橘裡封疆别莫作凢間勝負看中秋苦雨趙知㣲登天柱峯賞月圗人愛中秋月色同忽驚凉雨翳昏鐘如何只隔一重膜不見仙家天柱峯南柯蟻夢圗忘了堂堂六尺身鬼花生艶幻㣲春絶憐蟻窟無分曉迷盡古今多少人崔䕶覓水圗哭㫁東風轉有情俄驚滿面咲容新當時飲水今猶醉别是桃花半點春倩女離魂圗有心誰怕鐡為墙直透虗空未易量若問合離真偽事滿池緑水咲鴛鴦崔智韜虎妻圗佳人睡覺失青山悪毒心腸賣笑顔認淂皮毛一歸去花枝無艶乕全斑玉川長鬚赤脚圗慣立煎茶屋角頭低眸頻候雪花浮一奴一婢亦作怪不為先生破屋愁陳搏睡圗五季干戈亂似麻慵将醒眼閲年華齁齁一覺華山裏誰問春開幾度花逋仙探梅圗雪壓咸平處士家凍雲鎖暝苦相遮欲知天上春消息只覔南枝苐一花蘓東坡前赤壁賦圗泛舟赤壁痛衘盃孟徳英豪安在㢤何似江山風月妙不從自已外邊来李伯時所画太一真人蓮葉舟圗太一真人妙出神聊乗蓮葉下南冥若人欲識空凉境但誦薫風一卷經無名氏廵􅉉数修竹圗四􅉉玉立碧重重終日相看眼亦空何啻数来千鄭所南先生文集我家清風樓記有以嚴陵清風閣記示吾者正恨不能飛上冨春山頂恣覌千尺釣臺焉吾矍然而言曰未䏻遂其超邁之志深有愧於古人吾當自作清風楼記非東坡所記之清風閣亦非越山赴官齋之清風楼曰清風楼者頗多皆非吾清風楼吾無家焉有楼楼固無風則有昔乾坤一索風雷生再索日月出三索山澤具先天之乾𥘉爻始動曰巽六子首出莫先于風乾天𥘉以陽剛變為隂柔散一氣撓乎萬物曰雷曰日曰月曰山曰澤曰晴曰雨曰寒曰暑曰萬物咸有資于風六子最柔順最䏻變化天地之機莫妙于風人但見無形而吹有觸而空入萬物之不可入至八荒之不可至此風也殊不知宣乎四時晝夜之中柔風也持乎萬古虗空之外剛風也是以乾坤六子最周流最無邊際莫大于風風之為風抑神矣風之變化皆不同風之名亦皆不同又曷為清風㣲噴嚢口浮偃樹杪飄蕩而来迂徐而去有當之者輕輕泠泠透骨瑩快一何妙哉一何竒哉此空濶閒静之所天地一時之清風非古今不息之清風是果何風道徳超邁之清風也葢光武故人嚴子陵先生其人也胸中空空無物不肯以眼垂視當卋半夜飛上客星不覺漢家江山亦俱為之精神夲亦無心以一絲之㣲髙懸東都二百年名莭至今人仰先生如在天上尚見其標致散而為清風併仰懐許由伯夷叔齊屈原子陵軰其意逺矣大丈夫焉能尾尾于人之後乎㣲斯人出後卋皆赱于威福之下足以殺其心而役之許由忘天下之有君無君夷齊痛天下之皆無其君屈原傷一國之不有其君子陵喜天下之再有其君此狂奴之所以大恣放其老狂也大抵古今超邁之人所出之時皆不同所遇之事亦不同髙懐劲莭則同輝輝煌煌俱不可當寕不以萬乗非為不尊萬鍾非為不貴吾之所尊所貴者惟終身以天理行吾之志而已大開懐抱純是古意𥘉不見其有他俱未嘗有所學遺萬形而孤往超萬濁以立命永吹此香浮動終古其清又至矣非獨一時薫其風者抖擞臭夢瞠寤瞳角直欲挈此百卋之下措于百卋之上與天地風雷日月山澤豁其昏滯還我明朗有能天地之風之所不能似或有過于風之行乎天下入乎萬物故其感動鼓舞後卋人心浮浮然若决水就下必歸于海又莫先莫妙莫大于此之清風彼怪風贔屭且不能終朝而此風此意最清而淡最有味最久逺最無然而不然胡然而然以其有不可冺滅者存焉偉㢤偉㢤吾弗得而見許由夷齊屈原子陵軰矣将何以為吾清風楼然吾之清風楼非天地之清風亦非有超邁道徳之清風特吾自清風其非清風耳非清之清風而無風非風之風清而無清非卋界為卋界鏗鏘萬象非窓户為窓户玲瓏八紘何待見披拂草木始超于上棟下宇何必欲驚覺天人有藉于機動籟鳴嗟大塊之噫氣安䏻䟽而為此情縦擎天之大柱豈解複而為此屋原不墮于十二重之間必又過于九萬里之速誰動誰静消息出沒無成無壊基址堅宻其氣匪天地之氣其形匪土木之形此意不可得終莫見其推雲送雨之迹所見茍不髙何以空其慿䦨眺逺之心莫盪泬寥而突兀泬寥不見髙明而擎聳髙明㧞木揚沙之怒號飛亷未悟天然多景消暑之品題騷人終為物轉鵬搏鷁退豈從于南北東西而至䑕墜燕空只為是𣏌梓楩楠所建欲譬大江千㠶寕如此快何止去地百尺無所不見好翻天上至活之機輪宏開刼外不朽之規模終歲東南舶櫂倒赱大海水萬倍岳陽大觀壓破洞庭湖甚于醉太初氷露浴沆瀣而流芳凉笑彼住蓬萊宫闕擘杳冥而開畫圗别有秋聲空翠樸簌其飛難以井幹䴡譙髣髴其影或與造物㳺何者為梯不藉扶揺送居然到頂至潔潔于雪至爽爽于月疇䏻更誦大王所獨之賦至髙髙于天至深深于泉想應不是仙人所居之境天籟吹萬不同慵聼物外緒言老子此興不淺浪傳江左竒才馬牛不相及誠有異矣星辰還可摘何其卑㢤滿鼻生香日日㡬信催花滿耳吹笛聲聲五月落梅雖無重叠之間架而輪奐屹然髙映于𬗋雲雖無作止之時莭而意度穆如自舞于碧空終不以劉琨之嘨以于莵之嘯以造五鳯之手假合而作其不可作竊勿與元龍之卧與淵明之卧與賦八咏之詩議論其同而不相同其實不絢五采壮䴡無清風外之楼而亦不受一塵點染無楼外之清風吾如是而謂之清風樓也夫但問得此非清風之清風誰歟自吾昔得之而為吾也天地風雷日月山澤淂之為天地風雷日月山澤道徳之士得之為道徳之士忠臣孝子得之為忠臣孝子百姓得之為百姓萬物得之為萬物四時晝夜萬古虚空得之為萬古虚空非融握萬古虚空四時晝夜天地風雷日月山澤道徳忠孝百姓萬物之機而委之終不淂見此非清風之清風夲無清風而為清風亦無楼而為樓其吾之眞清風樓乎安淂出世間八風又出天外八風之人握手登此無清風樓之清風樓相與恣傲㳺泳讃罵賞弄非清風之清風也哉無絃處士説典午之夢義熈以還滿目不堪吾何以觀淵明見幾頗早解印息交竟歸去来性剛才拙邈與卋絶數詠髙莭獨書歲月却喜野老爾汝懐抱願鋤荒草𣸪聞斯道尚情夢古流笑睨物自見自心白于白日非羲皇上人而何或詩焉或酒焉或耕焉或㳺焉或著文焉或觀書焉亦寓于無絃琴焉每朋酒之㑹則撫而和之曰但識琴中趣何勞絃上聲其傲弄當卋非凢情所忖雖所寓不同同此意也大江之潯皆晋山林草木森森知之最深歲在丁邜晋徴士陶潜卒後八百七十七年雪心先生羡無絃之意亦假而寓焉淵明苦嗜酒不能琴淂其趣聼以醉雪心不嗜酒素䏻琴黙其聲聼以醒一醉一醒異卋同領一能一不能異見翻相承昔孔子嘗吿子夏以無聲之樂矣淵明夲自曠踈亦或有契于聖言緒餘淵明無絃琴果何如以吾嘗聞我之無琴之琴而逆之或淂之吾之無琴之琴今相安在吾心爾不以存亡淂失而失焉不以借于聼而聼焉吾心融融天趣空而通彼想憧憧卋網䝉而聾宜彼無琴之琴無朕可尋雖無宫商至樂悠長欲辨玄黄狂見荒唐動静冺亡逺邇蒼凉不知其方自然成章非配桐以梓可以發提天機不露萬響如瞽純越邃古曷聞曷覩妙指莫施慧耳奚為精神不疲志氣不移萬無歡悲一無成虧何必戴逵焉用鍾期魚鳥何知鬼神莫窺心聼則癡智聼則疑事聼則墮理聼則支聼内持聼外遺聼有隨聼無違離㣲墨屏音眉癡俱不宜俱不足以明之将何以彂此機胡不委無心之心于無理之理􅍾無琴之琴岀無聲之聲無琴之聲琮琮琤琤與一氣同生與两曜同明與四時同行與萬物同榮妙此獨清渺于八紘索之弗闖其形迎之㒺測其靈何從而聞無琴之琴無聲之聲古今之人其生也孰不賦一氣而為命孰不照两曜而為鏡孰不􅍾四時而為柄孰不共萬物而為境不出有為之井不能跨空而騁癡欲鼎鼎逆赱㺯影誰激清冷猛于一省無聲之聲不琴于琴此聲無根託物而存天下萬物之物之聲也非此物也而此物也非此聲也而此聲也奚其琴奚其絃奚其聲三者悉冺于無迹然後吾之心始出吾之心出然後與萬化冥而為一擊莭孤嘯浮動幽渺横握其要似絶此妙是真無其賞音矣是吾亦真不能琴矣既真不能琴矣是真無琴矣既真無琴矣是真𣸪何言㢤既真復何言㢤此意淵哉玄哉竒哉㣲哉上而皇天蒼蒼然下而后土茫茫然中而四顧荒荒然詎肯與人同耳而聼同目而視耶又安得不獨抱此意與之同終同始同生同死邪此是别曲還與誰聼清而寕和而平天然竒特之經開古今翻滄溟浴有情空泠泠還冥冥但蚩蚩之氓聞吾言必驚使淵明在時親見論評亦當開攅眉而相逢迎今不復見前修典型乃與雪心相遇于衰暮無聊之濵勿嘆凋零百勇皆氷萬物必待剥落而後成勿嫌無䏻之名空活不死之春譬如無絃之琴不耀山水之音寕枯于至貧㫁不可失無絃琴君欲不寒斯盟切勿辜負陶淵明久假不歸其名不名曰無絃處士亦宜始者顔延年誄淵明曰晉徴士又曰宜謚曰靖莭徴士南史則曰靖節先生晦翁獨取晋徴士三字書于通鑑綱目梁昭明太子作淵明傳曰無絃琴别夲又作無絃素琴晋史作素琴絃徽不具南史只曰素琴苐無絃琴三字甚雅且乆響于人口耳間康節嘗品題之禅門亦借用之詩人多詠之古作弦今從之送吴山人逺逰觀地理序天下之人天下之事莫不以立心為夲立心正事罔不吉立心不正事㒺吉茍不然雖能之非福也葢古今不易之論也今子挟地理學而逰且誓以大地之心為心是知所立心矣子亦知夫地乎地未嘗有封畛也而人封畛之地未嘗有彼此也未嘗有取舎也而人彼此之而人取舎之地雖能生萬物能載萬物地亦莫知其所以然而然地之為地溥矣子果能誓以大地之心為心則子之為子亦溥矣子抱清淑之氣英邁之目飛歩九州流視八荒若出空中而俯地下日日歲嵗貫于心胸竟不見有他物惟見滿眼皆大地耳直将身而為大地剖大地心髄滌剔而細辨之大地雖茫茫然盡落在吾子雙眼中故凢所至曰某地如何曰某地如何咸契其事豈非立心之㣲騐與倘淂誓父母之心以為心者與子相見口未言而意先化子必持平日以大地之心為心者心禱于上下神祗期必無愧于所志所學此欣然彼欣然天欣然地欣然天地必開子之雙眼靈子之雙足一踏竟踏于此䖏地宻而天近山正而水妙龍舞而進角虎蹲而跪爪鬼悦于隂幽人慶于陽明此竒地也淂之大喜希有希有以此為孝子順孫辦事竒㢤天地不與斯人而誰與乎庶幾不負子之以大地之心為心也是故彼之心既能一心誓盡至孝之心上當乎上天之心以為心而此之心亦能誓溥至誠之心下通乎下地之心以為心天也地也彼也此也合四者為一心决當淂上穴彼之心雖克盡至孝之心復妄想以利自已子孫為心而此之心但以盡所學而為心恐亦淂中穴彼之人事或未至而此雖欲神其術天地将封其吉地而蔵于子雙眼之外子縦剖心竭術終歲求之何從而淂其地邪又况後卋之人两偽相對以貌相刼一吝以虗禮餙其情一貪以大市其術而共失之各以小智㣲巧欲盜天地之機可乎不可乎吾嘗以後世之心試子之心子憤憤作色曰吾决不如是惟盡吾之所志所學而已矣事了而去安肯囘顧或不與我合冨貴之人數數挽破我衣焚香致禱求我駐足我已飄飄遁去果如所言誠大異于他人所學子来吴皆不識子之心之學舉足即行見天愈大見地愈濶終有與子相合者相遇于数千里之外以心照心一見而醉是真識子者也他年相見必空天下山水矣答吴山人問逺逰觀地理書所南翁福之連江人也落命吴中不與世接久矣夫何天風吹子来前與吾相見問逺逰觀地理之事而子又謂某家傳地理學幾二十年以能問于不䏻何邪終不成味古人之所殘釣吾子之所蓄倒售于吾子陳言泛意想不足以新子之聼既有問只得破口傾出自巳胸中之天以廓吾子之天勿怪其荒誕無緒不與地理書同也今吾六十四歲矣二十二歲壬戌二月我父菊山先生卒于吴中十一月葬于長洲縣甑山之原天幸保全四十三年略無他説㓜嘗聞我父曰汝祖卒于枝江縣主簿葬于南門外我一两歲失怙恃莫知所在丙午歲逰荆州止望祭于南門外我祖宗墳墓俱在吾連江透裡我終天憾恨不消今我祖之墓不知何如我父之墓未知其徃又為無後罪人惟有終天痛哭于㒺極尚忍言墳墓之亊邪古之葬者厚衣之以薪葬之中野不封不樹将以冺之于太朴之天也劉向言黄帝時始製棺槨自是以後縁情制禮三代損益尚從簡朴寕儉寕戚為禮之夲始淂盡子孫之心又得盡春秋霜露之感祭于斯拜于斯也古人胸中髙明一見便了所以古法人人皆葬皆無疑背㒺不合宜未若後卋唠唠叨叨支支離離棄本逐末侈為乖謬司馬温公葬論伊川先生葬説允為儒者正大之論終難磨滅唐吕才救時卜宅禄命葬三萹其説亦正才所學則淺陋也吾每思之天地間山水竒絶之處世間冨貴之人各有氣數安得人人俱得吉地葬之又安得冨貴之人復淂吉地世世永享福夀冨貴邪天地亦不肯妄加祻福于人亦安得使人可㺯智術移易天地氣數禍福邪堅欲厚葬吉地决動温韜竊彂之心今江南歸有數十年完墳何獨樵児牧𥪡荆棘狐狸之悲乎凢子孫堅欲上穴為安厝計有數十年求之不得者非惟死者不能妥其隂魄而生者空勞心費財有累飬生送死正理强㽞死者未得入土骸骨却為自已他時冨貴之謀何孝子順孫之用心哉抑不思左傳曰天子七月而葬諸侯五月而葬大夫三月而葬士踰月而葬葬莭書法或書其緩或書其速或書其禮其非禮其過制厚葬春秋其嚴乎與禮記葬期㣲有異是為古制必有以也且地理之説其可考者自公劉居豳有相其隂陽之意至十四卋周成王有命召公先相洛之亊孔子有卜其宅兆而安厝之之語卜者擇其吉也禮記曲禮已有前朱鳥後玄武左青龍右白虎之說暨乎春秋左傳書葬多主乎大義不及葬法儀禮禮記丧祭最偹語葬亦多主乎禮不及葬法檀弓縣子曰夫丧不可不深長思也至于葬獨不深長思之何與又當思國子髙曰葬者蔵也欲人弗得見也孟子曰無使土親膚也是掩親之道也孔子曰葬欲北方北首三代之禮也之幽之故也禮運曰死者北首鄭康成註謂地蔵為葬也是不可首南首東首西而葬也此三代之葬法也子㳺問丧具夫子曰稱家之有亡有母過制茍亡矣還葬縣棺而封窆同謂無則便為窆束棺直下而葬也孔子曰吾見封之如堂如坊如夏屋如斧馬鬛封也孔子以延陵季子習禮觀其葬長子於嬴博之間孔子曰其坎深去聲不至于泉謂度深淂宜曰深此即孔子之葬法也孔子合葬于防封之髙四尺從周制也有子曰夫子制棺四寸槨五寸孟子曰中古棺七寸槨稱之則棺槨六向俱當厚也荘子曰衛靈公死卜葬于故墓不吉卜葬于沙丘而吉掘之數仞得石槨焉則周末已重卜葬之吉㓙矣漢興風俗漸繁漸華正如漢京房軰卜筮之㫁不如左傳載卜筮之㫁明白簡當也淮隂矦布衣時貧無以葬母乃行营髙敞地令其旁可置萬家者太史公聞淮隂人言視其母冡良然則漢𥘉已尚地理山川之勝矣至晉地理之術盛行如羊祜猶出折臂三公陶侃葬牛眠地郭璞葬龍耳不三年當致天子等説久相傳為美談地理家謂始于赤松子青嚢書錦嚢書狐首經樗里子青鳥先生郭璞一行師袁李曾楊軰俱精其術郭璞青囊中書已為火取去今所存狐首經為苐一書邇後其書千百議論縦横遇有安厝咸以此亊為重誠不可廢流至于今耀為竒術子母以是而動心乎欲以市道網利則不可欲以隂隲存心則可有足力無眼力則不可有足力有眼力則可欲之天下四方觀天地造化觀天地氣數觀天下山川觀天下人物觀天下風俗觀天下文章觀天下萬亊觀天下萬物則可子正少年鋭氣英彂宜為古人宜學儒者不優于儒者不足以通天地人也吾其人也吾之上即天也吾之下即地也中其中者吾也以其中仰乎上則蒼穹髙懸尊不敢望以其中俯乎下則大塊横陳近可諦視足力所到目力所窮了不可逃于吾胸中既不可逃于吾胸中即今雙足之下尺寸之地来龍從何彂源若不䏻見吾雙足之下来龍則不知吾眼底所見八方来龍若不見吾眼底八方来龍則不知此縣此州衆山衆水一丘一壑各各来龍若不見縣州山水丘壑各各来龍則不知九州五岳萬山萬水各各来龍則不知至逺八方遐陬絶域四大海中一切大小山水洲潭諸國不與南閻浮提中國接壌之地各各来龍畢竟畢竟不知渺渺茫茫無邊大地大海全體来龍欲知茫茫渺渺無盡無盡大海大地全體来龍胡不以仰觀俯察近取逺譬之理反覆精思天地人之全體更反覆精思之復反覆精思之求于必悟以通其太妙昔者大禹隨順山勢濬導水脉因其地理支派别九州以治水本不論天下地理形勢南揚北冀東青西雍中間周圍三四萬里為堯之九州天下尚書以積石為河源苦不逺窮于析支渠搜之外周禮大司徒求地中以建國周知天下地域廣輪之數逺不出于九州之外唐一行以山河之象存乎两戒其北戒自三危負地絡之隂屈曲入東北至朝鮮是為北紀北紀為胡門河源為北紀之首其南戒自岷山負地之陽屈曲入東南至閩中是為南紀南紀為越門江源為南紀之首两戒乃雍梁以東两支山勢两支水脉只是論唐天下十道之形勢更自三危而西北幾萬里方至崑崙山始是黄河之源漢使張騫窮河源續博物志謂騫至宛夏間見河水初示逹其潜彂處小崑崙山宛夏間至大崑崙山尚極逺桑欽水經謂崑崘山去嵩髙山西北五萬里髙萬一千里淮南子博物志其髙如之司馬遷班固咸賛崑崙山髙二千五百餘里日月所相避隱為光明正是大崑崘山其上即釋氏阿耨逹多池流出四河黄河居其一東土之山勢咸自西北大崑崙山迤邐而来至王屋太行飛狐上黨諸山為東土天下之脊自大崑崙山更西南幾萬里以上方是西海倘不能盡論南海之南北海之北東海之東西海之西非大地之全論不知其大焉知其㣲㣲者以何為體不知其近焉知其逺逺者以何為界知地而不知天知天地而不知人知人而不知天地知天地人而不知萬物非知天地人之全論天不獨為天亦不自知其所以為天地不獨為地亦不自知其所以為地人不獨為人亦不自知其所以為人萬物不獨為萬物亦不自知其所以為萬物徹見三才之機互而萬之則三才之道妙矣天形圓而完其體則正故能範圍造化中大全之體則以日至天頂為午日入地底為子地形方而平其體則偏僅能凾載天運内下半之體則以極南為午極北為子天道雖左旋天氣則下降地道雖右轉地氣則上騰地勢雖散漫平赱八極而向東向南最低最弱最薄地運則在地中宻移東西南北而不定地外地之全體則在大海中隨春夏秋冬四逰而有凖然地之正體以下以北為正丙午壬子正當其正山亦地也為陽中之隂而峙水亦地也為隂中之陽而流山以南為陽以北為隂水以南為隂以北為陽山體雖鎮静其勢則活動水勢雖浮動其體則平静東土水勢雖東流東海潮勢則西上東土山勢皆自西北大崑崙山彂源乾山為山之正位為先天之艮山後天寅為艮山亦為山之正位大崑崙山西山皆西向水皆西流南海北海東海西海之外諸山皆深深逺逺自海底而来突出未易評論决非山海經所能盡知地之陽氣盡從地底而上故純坤之伏卦為乾山之陽氣亦自地底而上由卑而髙陽氣直逹山頂故艮之陽畫居最上爻冬至後陽氣盛水土漸重夏至後陽氣衰水土漸輕坤雖柔也翕則歛而歸根闢則散而生萬物當夏至一隂後至閉塞成冬時地氣亦上騰但至深至㣲至宻耳午時後亦如是以天地間未嘗有一息不升降流行之造化也而人亦未嘗有一息不升降流行之氣脉也而坤地之妙用亦未嘗有一息頑静而不流動也潮者海水還歸尾閭之底為潮落大海氣脉吸而入也尾閭外之水湧出大海之上為潮長大海氣脉呼而出也良以望夕之月受陽光正滿則望夕之陽潮直至子時正盛而正滿晦日之月選隂魄正滿則晦日之隂潮直至午時正盛而正滿世傳初三十八為潮大信如陽極于夏至而未月之末熱愈熾隂極于冬至而丑月之末寒愈冽也月與潮與人身中陽精藥物體雖不同而同一造化又日月五星行度一切星辰一切風雲雷雨等又隂陽五行八卦八門九星太一十六星等又刼数年月日時時莭氣候支干方位一切吉凶神殺一切天神地祇一切諸法一切造化妙用無窮無盡皆一一各各變化不同又天下無盡世界地不同山不同水不同一丘一壑相距不多歩尺鑿深或間㝷丈土性土脉土色土味土聲水性水脉水色水味水聲石性石脉石色石味石聲一一不同各地所產禽獸所生草木以至種種萬物其状其性一一不同三才萬物萬亊萬法萬變萬異無窮無盡一一各各不同其不同一一雖不同一一莫不皆有倫序文理支脉一一各相背而馳不相統不相合不相通不相同自生自滅自始自終自形自色自性自命各為絡繹各為經緯各具一切各辦乃事非真不相統非真不相合非真不相通非真不相同不同者不通者形也事也通者同者理也氣也數也莫不皆自宜其宜也莫不皆自然其然也皆所以錯然倒順彌綸宇宙以立三極也天地人萬物皆活物也皆以南北為經東西為緯也皆一理也一一皆以大造化為夲大造化以何為夲以真陽生意為夲天以之散為萬象地以之散為萬物人以之散為萬事其根源一一杳冥乎至深至深玄㣲之中而事業一一發見于無盡無盡廣大之外其實皆原于真陽生意也真陽者體也生意者用也二者夲不相離也不偽于偽曰真不隂于隂曰陽不死于死曰生用之無盡曰意故曰真陽生意其天地人之神氣乎其天地人之命蒂乎不以古今變不以頃刻停鼓舞萬化無有終極其機或焉滯天地閉在人則病其機或焉息乾坤毁在人則死列子曰天地空中一細物耳人又天地中一細物耳然其理甚妙其心甚大其機甚微其氣甚深其體甚真其用甚溥可以與天地並而参天地之化育者以此天猶吾身也地亦猶吾身也今吾之身相與生其生者皆十二經脉竒經八脉行乎至深至妙之中層負萬氣支縷萬脉統緒相纏首尾相銜次苐相軋玄妙相應貫頂貫踵縦横維絡五臟六腑四肢九竅周匝循環呼吸吐納灌注井滎流通榮衛氣血筋骨精神魂魄三百六十骨莭八萬四千毫竅以之為身其妙未嘗不相通也以之為穴至于種種之亊其妙用又未始相同也此所以為一身来龍之関鍵也其能如是者乃吾身中下丹田先天先父母一點真陽生意流衍之妙也其人之神氣乎其人之命蒂乎當天地造化真陽生意動時人之三焦之原十二經脉之根夲㕠腎之間下丹田至深深至微微之中一點真陽生意先動任督湧泉一時俱動天地人萬物咸同此真機而相通焉㕠腎之間為下丹田出神景内經馮玠註難經八難下註引之甚詳黄庭經脾長章註引玉暦經亦然又道蔵别經䖏䖏皆同此説人能通真機之妙得此其陽藥物聚則成丹不聚則不成丹乃妙于人者之聚也粤自判重濁為地之後柔者為土剛者為金頑者為石英華榮茂者為草木雜氣為物秀氣為人皆依于地而形其形者也然皆不識地之所以為地能博厚無疆彂育萬物何所藉而能如是孰知夫大地之下皆一重土一重泉相間為九因而曰九地九原九壘九泉也層負萬氣支縷萬脉柔順鞏固盪化流躍斜細其軸互為鉗鎖深運其機宻相槖籥張布玄網維絡地根非金非石非水非土千千萬萬經攅緯織牢牢不可觧重重不相礙綿亘持抱幾千萬億里無邊大地懸浮于范茫無邊大海之上以之為地其妙未嘗不相通也以之為穴至于種種之物其妙用又未始相同也此所以為大地来龍之関鍵也其䏻如是者乃大地底至深至玄先天先地一脉真陽生意流行之妙也其大地之神氣乎其大地之命蒂乎此下鎮地根之大寳也真陽生意躍為浮散流溢于淺淺之處則地氣泄而虗耗不用之猶不足凢百亊皆不宜真陽生意妙于凝合反抱乎深深之根則地氣宻而柔實雖費之亦有餘在天下則太平在人則夀則為神仙真陽生意其天地人萬物之福基乎淮南子博物志所載地下有四柱三千六百軸非真有其形聊借譬喻真陽生意有大力量負荷世界支撐刼運也𥪡亥大章所歩幾萬幾億之多非真有其數不過測量博厚無疆之地勢也又如十大洞天三十六洞天亦孔穴之至大者可以通仙靈出入之路洞者空也通也洞而為天也純是陽氣結而為骨潜自崑崙分跨海外洞洞相通犬牙相錯十大洞天三十六洞天只是一洞外無隙罅内有光明不入凢穢宻貯妙暖十大洞天三十六洞天七十二福地皆地底真陽生意凝結流衍之妙也三十六洞天不可葬如人身上有三十六穴不可針七十二福地不可葬如人身上有七十二穴不可灸俱禁穴也洞天福地神仙長生之氣不可以尸氣犯生氣也其洞中四通八逹之路為大地来龍之骨與人脊梁四肢莭莭相柱有筋附骨絡之外寔而無穴中通而有陽髓之意相同世人肉眼不見身内支脉節節有條理竟以此身為塊然之肉世人肉眼亦不見地底支脉井井有條理亦竟以大地為塊然之土殊不知天地人萬物皆有文理支脉烟縷氷凘壁裂瓦兆尚有文理謂之地理獨無文理支脉乎曷為地之文理支脉其来龍者地之根源所自本也又取其勢如龍之来蜿蜒活健也勢之大者厚徳載物次則廣濶坦平委蛇坡陀嶮峻崔嵬之状也支者勢之分也又外則路之所通内則脉之所貫也脉者真陽生意流行之迹也穴者地氣山勢来龍支脉真陽生意之妙畢聚于此凝結不滯活動不流之窟也此穴之能福于人者真陽生意凝結不滯活動不流之澤也穴者竅眼也針穴灸穴非竅眼曰筋曰骨曰肉不曰穴葬穴非竅眼曰土曰石曰泉不曰穴以其能通不能通内外氣脉之機為義髙土為頃兆域為墓即宅所兆也兆朕也謂地之一罅㣲露造化毫芒妙䖏即竅眼為穴也與鑿井無竅眼通泉脉則不為井之意同鑿井横出泉眼来䖏近淺而易竭水味汗泛直出泉眼来䖏深逺而不竭泉味清甘土實水妙土虗水濫方方䖏䖏鑿井者見地下土與泉各各層層色澤氣味亦難盡其説泉之正直而上曰檻泉縣出曰沃泉謂倒􅘇而下也側出曰氿音軌泉湧出曰濆泉所出同所歸異曰肥泉所岀異所流同曰瀵泉井無水曰眢井水一也以泉来䖏不同而名不同味亦不同也山地一也地脉陽氣發源不同有散出者横出者直出者曲出者半地出者一脉分衆脉者衆脉合一脉者地氣竭有穴無脉如眢井者其類衆泉之各異出而異名也山勢以横走而来地氣當直上而出横者束之勝則穴深直者漢之勝則穴淺地之陽氣勝爲有餘山之形勢勝爲不足山地二脉紐結均平爲兼美其間之脉山勢互横互直互斜互曲互正互偏互相坱圠種種内異脉外異状不同又過于泉脉多多以是聚而為穴又一一不同有山勢地脉相逐相軋相束相入囘抱真陽之氣倒􅘇結秀于地中者此歸源之穴也此最難淂難識發雖遲葬之久久子孫終有竒特淂道之士穴之為穴非千萬可悉議其所以為形勢氣数者形者天生其物之象也勢者物情前陳之状也氣者天地萬物盛衰之候也𢾗者天地萬物盛衰之限也形勢乃天地萬物之部位氣数乃天地萬物之機括形勢外也氣數内也一切形勢卒難自變盡是氣數逼之換骨形勢雖竒氣數未来無以發其妙趣有華䴡之屋在焉無冨貴之人居之縦華䴡亦衰冷其如辜負此華屋何地乃隂物乃寒物乃查滓物而于隂寒查滓中淂陽和精華之妙非寳而何非真陽生意而何此真陽生意實自深深地底根源而来與人之一身十二經脉竒經八脉逺逺自下丹田任督維蹻諸脉根源而来見于骨莭皮膚之上而為穴之勢頗同天地人造化之機悉不在外悉在内悉不可見悉不可知故妙故神世人焉得見之焉能知之地理之法又與針法同不知醫脉者則不知病不知病者則不知正穴毫釐之差即不淂穴或淂其穴針之無法淺深不中度反病于人不識真来龍者則不識真形勢氣脉不識真形勢氣脉者則不識真穴大地茫茫然不可尺寸量或㘴向不當或失于東西南北之㣲差或深淺不中度皆不淂氣脉之正形勢正而氣脉完者唯一穴祔葬則分矣祔葬即合葬也祔葬亦有離合之分衛人之祔則離魯人之祔則合謂隔槨别壙之分也詩云死則同穴檀弓曰合葬非古也自周公以来未之有改也䘮大記曰男子不死于婦人之手婦人不死于男子之手意不欲死者戀戀于所私乎子孫附葬于其下者皆受正穴之福澤也葬骨殖𥘉無偏正勢又輕矣葬衣冠杖履則寄誠也盍取形勢正而氣脉完者爲善形勢雖正雖完雖妙氣數已過非吉也識形势易識氣数難識穴尚易㝎正偏淺深尤難纔遇形势氣数淂其大體正以主之衆者客也主為君客為臣君居正位臣伏四方須當熟視偏正不必苦泥末莭穴不真位不正不可作如是説若人平日心地不開眼力不真臨時㣲差其意則龍側虎倚風擊水衝関係不小風水有渙散之象山風有蠱壊之象風䏻扇播地氣夏至以後風自上而下漸漸吹来直入地底曾有為巽風吹側墓中之棺者水能衝地氣能泄地氣能截地氣使山地氣脉直從水底過地而去亦能囘抱地氣映帯地勢凢當要衝處俗諺戒之如當風門水口遂相􅊞以為看風水最忌無情之風無情之水無情之山無情之地内無含蓄則直則露則無情則不吉以其不能聚真陽生意而為神氣也或㣲拱而不聚或聚而不凝不活者為虚位為盲穴似聚者暫駐而即去㣲有渗漏便不完寔真聚者凝結而不滯活動而不流者為真穴其真自千里百里十里從他山分勢舞来至此歛然而止或自地底發源深深直上至此欣然而聚多有真似種種物象之形者或平原曠野間或水底或石罅别有竒異有非人卋可窺晲其深邃之妙者其地之上也外欲宻而内欲敞欲常見日月欲不紊隂陽欲最茂草木欲不生蛇虺勢欲團簇氣欲䟽通意欲清美色欲明净脉絡欲䧺健深厚而不露骨肉欲勻實柔净而不枯骨者石也肉者土也大體欲左右宛轉擁䕶環繞頋戀有情如朝王者然後為佳使其地氣支脉湧沸而透為一竅山勢来龍旋折而注為一窟两宜相入通而為一停涵蟠蓄衆妙絪緼凝結而不滯活動而不流其地之下也外必柔而内必化土重而體清紋細而髓深暖如春氣如雲潤如瓊粲如金流泛甘香不與土同羣竒雜瑞叢然相獻内外四方靡不相宜其一山一水一丘一壑之神氣乎其一山一水一丘一壑之主位乎環視此外皆奴僕爾一窟雖宻其止必有瑞氣其下必有靈物一窟雖㣲其餘潤所及或數里或數十里莫不隨其地氣支脉山勢来龍相宜情態委蛇踊躍逺近大小清濁淺深髙下輕重盛衰通塞之勢之意為地為穴之優劣勢之所駐為止氣之所㑹為聚止而不聚則非穴山脉地脉不止則無穴果能抱真陽生意之妙止而聚則為穴此妙于地者之聚也人多看山勢之止不識地氣之聚山乃附于地者也當以地為主平原曠野間當獨論地下氣脉氣數多不喜平原曠野以為無形勢可取正縁不見地下氣脉氣數盛衰端的爾平原曠野間忽得清暖妙潤之地雖不如山之髙峻而逺于應騐因其平坦極是耐久而平穏是以古者葬之中野也先論地氣然後論山勢乃為全論山勢露在外易見地氣潜在内難見止以山言聚以地言易萃卦曰觀其所聚而天地萬物之情可見矣聚之義妙矣㢤天者大造化之聚地者山水土之聚都邑者人民之聚山者土石之聚海者水之聚聖賢者道徳之聚儒者徳行才學之聚佛者福慧之聚神仙者純陽之聚男女者父母媾精之聚冨貴者福徳之聚一切諸寳貨造化秀氣之聚皆聚則妙不聚則不妙聚則冨貴而有權不聚則貧賤而無權大聚則大妙小聚則小巧久聚則久耐暫聚則暫美大凢陽氣聚則暖暖則生精神生萬物陽氣聚為生為吉為福隂氣聚則寒寒則不生精神不生萬物隂氣聚為殺為凶為禍不可不辨陽氣浮于淺則為暖陽氣極其㴱則為熱人之水臟之下極熱不熱不足以化諸食不足以運諸世事地之水輪之下極熱不熱不足以縮諸水不足以消諸隂氣萬物之生其受氣雖偏而雜只是藉此一點暖氣以生其生真火即真陽生意也為三才萬物立㴱深之夀根也深深者不外其外而内其内也世人不論内論外髙人不論外論内外冨内貧外强内弱外勝内不勝非福非夀非根夲之論有䏻一覰直透數萬丈波濤之底者方見龍宫海蔵分明可唾手取苐一顆鎮海明珠有類如是之地不生竒特之人必生竒特之寳所以佛仙勝迹鬼神靈宅多㨿山水秀異所聚之地可以赫其靈可以尊其神葬者可以妥其魄可以昌厥後皆天地山水真陽生意氣脉凝結不滯活動不流之妙所致其天地人神氣之流慶乎𬗟想周易聖人為棺槨治葬之法翻異初六為兊上六是為大過卦大過乃始乎巽隂終乎兊隂之卦雖始終乎隂也包乎外𥘉六上六之隂畫包乎内二三四五之陽體是拱其陽而聚之于内也始于入巽之隂終于悦兊之隂巽開隂卦之始爻兊了八卦之終事始可以終乾父坤母之大事能了父母送死之大事當以外拱其隂以包之内聚其陽而實之之地而葬焉則死者入而悅矣有歸根還源意孰曰㳺魂上古葬之中野者何中野者非獨指一處凢一山一水一丘一壑所在莫不有天地正中之位天地正中之氣外而得地勢之正内而淂地脉之正其真陽生意之機之聚寕不在是宜東不東宜西不西宜南不南宜北不北宜髙不髙宜低不低宜深不深宜淺不淺如葢覆凾分毫不差㣲有参差即不相應皆非中也氣數已過氣數尚逺亦非中也中則和不中則不和和則真陽生意聚矣古者葬之中野聖人以棺槨取大過皆寓葬法扵言外諸葬書盡不議及此若地理四面形勢似乎潮落吸其真陽生意歸歛地中宻拘于内是為葬者之穴若地理四面形勢似乎潮長噓其真陽生意浮漾地上流潤扵外是為生人之居此隂宅陽宅之分也若倒用之力則减矣開闢𥘉心彂而為真陽生意以溥大化天地尊位山澤通氣夲不為葬而設夲為生民立極鼓三才萬物生死之機開斯世興衰無疆之運先古氣清後刼氣昏此意玄賾存于不論一郡有一郡之形勢氣數一縣有一縣之形勢氣數坐向前欲正而朗後欲實而厚髙而不䧟左欲昻而長右欲低而短分而相向捧􅌉獻珠怪其光明燦爛見者顔面亦生紅潤地欲厚土欲重古人毎稱土輕重騐地岡厚薄立郡治縣治宜扵坐鎮四方潤澤生民地下氣脉所聚者大則為郡為縣人物所聚必繁盛陽氣不聚則土弱而地無力不宜勝載世事陽氣聚則土實而地有力則地與人相宜而生福聚之小者為穴而為穴之形勢氣脉則欲歛束山之與地數里數十丈之形勢氣脉聚于或一二丈㦯數丈之餘愈宻愈妙捅地蔵寳貨于不露形像葬者冥竊天地真陽生意一罅之暖自然宜其後人吉無不利地亦欲厚土亦欲重一郡一縣之間可居者多可井者亦多居而竒則少井而竒更少欲求穴萬或一二真陽生意散而流行天下無徃不在無徃不生草木萬物然氣聚處少聚而為穴者真陽生意之小小至微一芽爾其大夲則垂䕃十方無盡衆生卋界抱朴子云天下一郡一縣一鄉一里一宅一房各有生地各有死地又兵家兵書多論天下戦守形勢其說應機出處便宜行事難拘其説如荆州永州息壌不可犯之淮南子謂之息土又地形之小異也廣南之地頗有悪戾之土葬及一年骨與棺盡朽為土四裔逺域更有麄硬悪戾之土非正氣也易曰立地之道曰柔與剛坤以柔道為正土柔而細潤則吉土剛而粗硬則悪山氣多剛地氣多柔柔勝于剛乃吉唐末逺方或以五色帛或以器貯活魚埋之一年彂視其魚生死五色變不變騐其地美悪其癡殊甚昔有至人教人待大雪中看雪不積處是穴又有至人教人執火把赱遇火滅處是穴乃陽氣散漫而出不容火燃也又有至人教人燃燈于所指之地看燈不滅處是穴乃一縷陽氣勁緊直出隨一縷燈熖而上不為風雨所滅也如数里数十里之間山地四向背砂礫冷瘦之土忽其中一圍或一二丈或數丈乃清暖柔膩之土至吉地也此皆論地下造化也皆真陽生意之聚之妙也水圎折者有珠水方折者有玉此其似也不止于此地運山運将興素有乕狼盡盡自去却與人相宜而生歡愛心如增如漲如地下藹藹有情于生春地運山運将衰曩無蛇虺戢戢亂生却與人不相宜而有損害意似偷似䧟似地下索索有聲而赱氣非有髙明之人見以見外之見即古山水開新氣象剖其精玄則失之矣唯是卋間萬事年改月換日變時化山山别水水别處處别方方别氣數别變化别興衰别久近别一别衆别别别無盡秪将别以益别竟莫别其為别以何别别之法别其不别之别應笑盡赱于不容不别之萬别世竟不識别有非别非非别之地在乎山阿一天之妙無盡四時之氣常和八方之風寒莫入数畆之土宜最多樂哉斯丘絶無偏頗宜以莵裘遯世婆娑宜以窀穸瘞殻嵯峨過于鐡函牢不可磨縦有萬别其如之何不遇至人意終不决至人開眼一照洞見天外天地俱新山水俱活一指指定不勞再指更不求其契合于一切法而自然契合天上隂陽五星九星四時地下五行八卦八門九宫二十四局三十六将一切造化何用安􅌉下針擬議来龍定主賓分拱按形勢諸事又何湏移路避衝改水換勢種樹𥙷缺培土爲照粉飾諸事世率以五行之山各二十四局纔遇一山一水若差一歩十歩又各有二十四局互換作數山數水之用互換爲主爲賓爲龍爲乕爲風爲水互飛天星互移八卦互開八門互飛三白互爲六儀人各出竒術人各出竒見展轉彂明各各曲折山水形勢歸于輪􅌉格局之中爲千千萬萬山水妙用此爲移尺寸之差盡換山水之勢頓别祸福之應乃人為之穴也寔非山水自然真穴也此意相􅊞巳久難可遽改若用坐東坐西則隂陽相差坐南向北則位置顛倒隂寒極重後人以枕所坐之山即為北首非北首也非天地正位也縦别有至竒特處不淂已而用之終减分數何况不深忖細論分金輪􅌉諸格局法只推測得世上尋常五行生旺格局未足以見地下真正自然氣數大地廣博氣脉紛錯紏纏潜赱地下自然變化自然竒特一一處處各各自然不同詎可以世間竒見活法移換拘束自然造化以三年一歩十歩一世種種諸法移易氣數勒為定騐山山水水處處方方氣脉氣數有時遲有時速有時進有時退有時然而不然有時不然而然又一一各各皆不同于不同果可以輪􅌉籌䇿算以活法局以定騐推測之乎天静無風一鈴獨鳴天津橋上聞杜䳌聲以心通知之亦似以風角鳥占知之不以尋常推測法知之而乃冩為山形板成死夲篹為格詩釘作死句争知天下事盡在一毫上錯過好事勿泥死法當開活眼勿執外境當察内情勿拘小局當觀大體千丈爲形百尺爲勢其見亦狭矣目前之所謂葬者不過取山水㣲有格局處不問無真来龍不問無真穴不能細論主山妄誕指東畫西誣合遷就立說只怕地下有石有水深鑿不過按天星九尺爲例却令多增新土培髙爲勢終是客土氣不相合江南墳墓棺槨去土多止三四尺豈治葬良法夫子封墓謂不可弗識非爲培勢徔古封墓論爵焉敢過制歟忍聞江南之人子孫零落掘焚取物賣地風俗悪薄可嘆反不如楊王孫立于葬也古者葬法俱不用石槨塼槨亦不用柏梁槨板四圍並不甃砌但以周圍厚木棺槨深深懸棺下葬不用槨亦可最以㴱為妙不畄影迹與後人知始佳古今天下處處葬法各不同獨此法最簡最妙只恐父母無治命子孫决不肻用此法舊以厯青和油煎徧刷棺外又黄泥石灰或查和擣却周圍實之久則如鐡極可取謀葬者當薄葬棺内無物棺外葬不華飾又當漫山無迹只可遥望拜掃庶或其可世人竭目力繼心思略見地上分毫氣數不能徹見地下本體造化猶相人之形貌醫人之疾病者不能徹見人之靈臺五臟豈善相也豈神醫也世人既見不分明不淂不再四為避凶就吉謀孔子曰里仁為美擇不處仁焉淂知釋名曰宅擇也擇吉地而營之也聖賢教人擇地而居之道也若夫橘踰淮而北為枳鸜鵒不踰濟貊踰汶則死及蟻遷穴鵲巣避風避太歲之類萬物各有所宜萬物各有所不宜禹貢任土作貢職方氏九州所宜厯代貢各州所産皆土地所生風氣所宜者易亦論及天地之宜象物之宜與地之宜使民宜之月令亦論来歲時令之宜大司徒以土宜相民宅與夫七月豳俗皆論天時地氣人事之宜與不宜隂陽家諸法諸卜皆論與此事宜與不宜考工記論天時人事獨歸重此此地氣然也真的確論夲乎地者親下故爾地氣非獨䏻變物之美悪然頗能移人之性情其地宜佛宜仙宜儒宜冨貴宜豪傑宜人民宜于清粹重厚者吉宜于濁悪頑脆者不吉種種人事所宜不同由于地土清濁剛柔變化之氣種種不同而然司馬頭陀識骨人不宜住肉山而識溈山主之竒騐是已或宜于此或不宜于彼或宜于古或不宜于今皆地氣使然也山勢地氣宜于葬者則宜于存者論地之外山地却要分明一依風俗古例存者立陽劵問人買地又立隂劵問土神買亡者葬地明示疆界幽告神明苟不宜客鬼争之土神訶之宫訟隂譴纏綿子孫乃存亡事理財物不正直分明所招非山地風水神殺之咎偷葬者有福無争無咎葬之不宜則為僵尸地寒氣滯骨槁肉堅之故肉軟者非僵尸暖則化化則吉况葬以蔵為義人之蔵物必蔵于㴱宻完固之處不為人竊䑕偷則物永久葬之蔵骸當蔵于暖宻完固之處𣸪藉山環水拱則墓永安更亡者在生徳行精神完固無失宜潜隂神暝如入定歸宿㴱宻鞠育靈活一窩暖雲漬醒冷骨寂以飬幽獨妙于逰冥漠何當躍滯爽扵玄夜𨳩生顔于尸解次則爪甲纏身笑面如生此大不易淂否亦過于南面王樂也非此暖意則太隂何以煉形真陽生意之妙一至于是于以宜後人以安以夀以冨以貴父母子孫一氣潜通幽明孰能間之人之欲安欲夀欲冨欲貴者固天下所同欲也抑又當思天有時地有運氣有盛衰世有古今天上刼運世間莫測而三元甲子一周一百八十年天運一小變地運一小變一丘一壑一紀十二年亦一小變小則地脉山脉或移風路水路或轉土有増有䧟石有長有泐又或掘鑿燒毁坍崩又甚則髙岸為谷深谷為陵又甚則萬方易俗萬化易位又甚則桑田變海海變桑田大則𣸪混沌𣸪開闢混沌開闢無有盡期造化氣數一囬天溥真陽生意以福于人則地氣通一方之水土俱甘香暖潤人物亦清正賢慧鬼神鳥獸亦咸若萬物亦盛多一切色一切聲一切氣亦俱清造化氣數一去地收真陽生意以還于天則地氣塞一方之水土俱苦澁枯寒人物亦愚陋悪逆鬼神鳥獸亦不寕萬物亦衰乏一切色一切聲一切氣亦俱􅘇禎祥妖孽可以前知人生無慧目慧耳慧性則不能見一切先變之色不能聞一切先變之聲不䏻察一切先變之氣不能辨一切先變之味以至一切處一切事一切物一切俗一切人一切心種種先變之兆外雖如然未變内已隱然先變小則數月數年前大則數十年数百年前已兆之矣如史記秦樗里子已先知葬章臺東後百年有天子宫夾我墓所言竒中非獨此一人一事亦非獨一丘一壑一物一事一家一郡消長之理如是天地氣數大體消長之理亦如是人與萬物尚未變獨地氣先變葢地為萬物之母也真陽生意盛則地氣盛萬物壮實而耐真陽生意衰則地氣衰萬物槁弱而不耐或消或長難以定論如海中沙渚或東湧或西沒如空裏雲霧或雨出或晴收又地水之外渾是金剛之氣乗而為輪自然天下八方地底無徃不當生金銀時未至氣未完體未堅物未出彼長此消古無今有各有氣數悉難以定論自古帝王建都下而小邦外化立國徃徃不同原扵天時地利人和各各與其主盛衰氣數之所感召三者有一不完則王氣衰歇古今天下三才萬物盛衰生死之運處處亦各各不同天地日月尚終歸于壊特歲月刼運久近不同耳安有一定不易之人事亦安有一定不易之乾坤邪亘古不壊者理也真陽生生之意也欲知地理之脉絡又當知地運之盛衰又當合天地人萬物之全體逆参其機括而擒縦觀之或淂其樞要焉豈可獨委之地理而不䆒天人之理也固是天下山水頗多吉地率皆天祕地隠神蔵鬼匿不使世人窺見其處其出也自有氣数决待吉人與之非天地私與之吉人自與之也太公五世反葬于周礼不忘其夲狐死正丘首仁也成子髙不肯以死害于人擇不食之地而葬焉􅓹􅓹佳城有主乆矣當時盗眼豈不欲竊滕公吉地似定数也孫鍾感三官下教其葬不亦重乎非設瓜也二人皆隂隲也君子有是心葬之不吉未之有也是以為悪人葬吉地上天有禁天地鬼神㫁不許無徳行無福之人私竊天地之寳以夀不仁之冨貴至人未嘗不見之未嘗不知之决不輕易漏泄示人况無先事而知隔物而見之術又無透空破地藍碧方瞳之人曷能源流天地人萬物一脉真造化乎其不能遡乎真造化者以舉世之人紛紜萬學一一盡赱于不相同之域而未造于未始不相同之天同其不同不同其同同其同不同其不同則不堕于同不同之偏不同者三才萬物紛然妙用同者三才萬物夲然真體𥘉未嘗同未嘗不同也悪可以天道地道人道物理一一一切之不同者惑亂其胸中之天耶庶幾不泥于天地人之迹而通乎天地人之賾也此匪術也理也三才萬物之理夲一致也欲造一致之妙必推其精粗而格致焉譬如乳出酥酥出醍醐至醍醐則極妙矣陽氣者一切有形中之至精者也是猶酥也真陽生意者又陽氣中之至精至精者也是猶醍醐也道家謂之水中金藥物也天地人萬物萬事萬法之各各變化不同也果誰爲之全論其全體全然同是一真陽生意千變萬化而爲之其先天先地先父母者也真陽生意果誰為之超此難言也按圗索駿泥形取像真死漢寕足以語此道世之所傳所學只是卋間法縦淂真傳妙用竒訣亦世間法不涉于世間法而淂之始為髙眼苦學三十年不如點化数語又不如一㕠乖覺之眼又不如一片玲瓏之心猶未也難㢤又况一切世法上聼上天所行又隨國法所轉又審世道汙隆又逐人心正邪尚之則靈不尚之則不靈又當識其時宜也㫁以不疑為上通逹之人皆可不通逹之人多忌諱此隂陽家諸法不容不存苐人鹵莽難闖其妙又不可苦溺其説又當觀人力量見識德行福徳為何如遇其地或太過而其人不足以當之亦不可天地至大萬物至多惟一至公之理行乎其中天且弗違安有私心然彼一一各有分劑一一各有法縁當以真情實行盡力行我之正大契彼之氣数忽然眼開見竒特造化欲加一毫人為不可淂奚特地理云乎㢤道家謂五岳之外有别五岳鄒衍謂九州之外有大九州列子謂焉知天地之表不有大于天地者乎釋氏謂南閻浮提為四大部洲之一娑婆世界為華蔵二十重世界中苐十三重諸世界中之一此其大㮣也恣情瀾翻何有涯涘是誠不可以聖智測度然天地依風風依虚空虗空無形無所依天地虗空根蔕安在必有剖破天地虗空根蔕者視之而笑且置此説尚有一則語頗費分䟽昔迦葉示滅窣堵波至今在天竺國雞足山中迦葉親抱釋迦佛金縷袈裟直待彌勒佛下生而付焉其事極逺極逺當時止是何穴又如何不隨天地山川氣数遷變邪理邪非理邪數邪非數邪子當努力行四方子當努力行四方一旦鐡鞋根㫁㑹遇無舌大丈夫厯厯明以吿子何止三教九流萬方萬法要㫖大地山水来龍天地人萬物隂陽虗空根蔕而已子終身之事畢矣子當牢記其語待歸以告我辭吴泮請儒師書某頓首奉書于吴泮廣文先生某幼嘗聞之揚子雲曰通天地人曰儒又聞之韓退之曰師者所以傳道受業觧惑也子雲退之能言之猶未偹也昔人莫不皆難之不唧􅘇鈍漢何由通此六者之意乎数十年来欲弓不箕欲冶不裘顛嗒固滯喚鍾作甕十字九錯百事千謬叢萬拙于一身宜乎化為凢民併與早年所讀所見之書一翻翻却甘于老而貧而病而死而已矣囬視古今萬夢不直一揔指胡為乎倐焉垂謬于萬古蒼茫之外摸著虗空如小物忽焉破想于一毫玄㣲之中笑看隂陽妙萬象或與青天白日互相斟酌或招山光水影交恣飛舞自我其我不他其他所以𬒳破跣赱狂歌醉笑扵雖與人語而不與人同語雖與人行而不與人同行之古路倀倀癡癡終日竟歲獨逰而莫知底止亦不知世間何如謂之世間又胡為乎一旦欲移之于詩書禮樂之傍果可以世間法縛之乎尚髣髴記淂数十年前我父有言曰夫子之道大如天六經之㫖深如海吾老矣何足以知此今又𣸪化而為野人矣是誠無所用矧兹吴中土風清嘉羣彦汪洋其来久矣至今藹如惟廣文先生以斯文為重閩中三外野人鄭某頓首三教記序我自幼歲世其儒近中年闖于仙入晚境逰于禅今老而死至悉委之苐邇來三教凄凉甚矣不覺数数為之動心各因其意作三教記何夙習之尚未忘邪然期望天下後世之心則㴱矣切矣吾其絶筆扵斯文乎早年逰學泮宫記我自三十六歲科舉既㫁之後絶不至于學校又三十一年終不能忘其為儒也昔五帝三代皆有學也禮凢始立學必釋奠于先聖鄭康成以先聖為周公孔子固是周之舊典至孟子出始播告宰我子貢有若之至論是以儒者皆願學孔子及漢興髙帝五年至魯聞弦誦以為守禮義之國七年樂行儒者叔孫通所定之禮是以十二年過魯不祠周公而以太牢獨祠孔子皆不能忘其所宗也葢吾夫子之開道統也雖不外于祖述憲章堯舜禹湯文武周公之意然以此道大開古今天下君臣盛徳之美聖賢斯文之運必凖之于吾夫子而後斯文始定而始昌此道彌尊而彌彰㣲吾夫子創始以儒道設教垂憲萬世則後世仰誰為儒道之大宗主至今國法家法身法心法天下之人凢百行事悉當凖之為法大矣㢤為吾夫子之心法何如者吾夫子以一日克己𣸪禮天下歸仁之妙授于顔子以吾道一以貫之之㫖語于曾子此二者吾夫子開道統之大夲子曰吾志在春秋行在孝經春秋尊王之經孝經事君親之書此二者明人倫之大法獨吾夫子化而大之所以為大聖人續之者子思子孟子周子二程子朱子陸子諸公疉疉而出皆有以開道統明人倫也凢自古為君子儒者何莫非此道道統之源集大成于夫子續于儒者儒者之事繫于學校學校本以教飬人才也何以教之自正心始何以始之由讀書入讀書而不見道匪為讀書見道苟不明則無真詣實踐不嚴于正心則臨事差忒義利莫辨况今既無以教之又無以飬之而又不能以禮義自飬其所飬其心餒矣每垂涎于外聞路旁腥芳之氣􅊞人必乗其餒而入則醉彼耳目口鼻也深意氣状貌與之俱變有似此身不屬于我者非道果離于人而人自昧其道耳奚不自悔自艾彂憤思之一旦日出勃然晨興八荒洞洞然與我化矣而此道至廣至大妙乎無垠與天地萬物相與周流曾無間然所謂吾夫子開道統之大夲明人倫之大法者一也二之則小一之則大皆我夲然之善固有之天也非外假也豈風雨晦冥所能惑也甫無愧于為儒抑亦激勵學校苟未至于大全其道得以切磋琢磨者其學問器識可經綸治道可著書立言俾天下人皆不越于禮義亷恥之域其効博㦲或非其人而儒其業夫豈曰儒自古有用之才為君子儒者盡出于學校當知學校乃禮義亷恥所自出之地豈徒有用而已切勿謂向之學校儒者惟業科舉時文腐而無用何𥙷世道然科舉時文其所講明皆九經諸史諸子百家天地隂陽五行萬象厯代君臣聖賢人物道徳性命仁義忠孝禮樂律暦制度政事戦守形勢風俗氣數文章技藝萬事萬物格物致知誠意正心修身齊家治國平天下之㫖要其中選者衆作粲如亦未嘗不妙也析理則精㣲論事則的當亦多開發後學其為人物典刑氣節議論𥘉未嘗亡也特行之有至有未至多成空言今言空言者亦㒺聞更三十年舊儒無矣後之来者出何不早不淂一拜斯文之盛嗴彼之眼何其貧甚欲問辯誰其問辯欲矜式誰其矜式欲就有道而正焉誰其有道向使我早年不淂父命逰學泮宫逰學四方出而廣大其見聞歸而我父開以天理将何以正其心将何以終其身今不敢忘其所教故盡死以我父為師但我無䏻為人也不能自具儒者之道而新之乃抱此拳拳空意欲以𬒳之将来可哂也已惟吾夫子之道無古無今無變無異無㫁無續無窮無極遂述此意名之曰早年逰學泮宫記十方道院雲堂記我夙慕長生甚欲創道院中年後化為頑物不𣸪作神仙夢想乃止昔嘗謂自唐以来若宫觀道院若僧寺菴院並絶少却多有真心出家之人邇来仙佛之居数倍多于三十年前而率皆冨者蔽身貧者竊食焉非真心出家通身俗氣厭罵貧者安有真心供飬于人也然則天下山水非不勝也仙佛室廬非不多也特未嘗多見有真心辦道者又未嘗有真心盡情供飬于人之人若無真心辦道又豈知供飬凢人與供飬神仙等無差别則滿眼但見盡是神仙更不見有世間凢人或生分别心曰此仙也非凢也非真道人非真道院曰道院者何道院與宫觀異道院乃延待天下十方蓬頭髽角跣足破衣清净雲水道人憇肩入靖之所其来如風其去如空似非世間人為流通大道而来耳寔以曩刼上帝憫世人䧟沒于欲海中不淂夀其天年勅神仙以長生不死妙道流行卋間擇有徳行之人而授之道家之道正法也謬師貪婪誇衒竒特千人萬説自異為髙至有魔法恣説百千種穢䙝之事誣汚大道迷之賣之于少年冨貴之人不顧上天有禁死則罪在不赦始者出塵濁遂入道既入道反再入于塵濁何其顛倒錯謬如此以其夲無真心于出塵離俗也胡不思大道乃自然清净之理神仙乃出塵清浄之人若不清浄則徳行從何而生縦是有功于人不從真實慈悲清净心中流出則不曰大徳行若無大徳行决無大脫洒决不淂大成就縦遇極妙真傳使其無福魔必壊之决不淂結其聖胎决不可身外求道道不在于身外决不可心外求道道不在于心外此心不真不定不純一不空玄有想有存有意有方所有運用有希望等事盡是妄想纔有纎塵即生魔業于深定中假有一切祥異皆為魔勿喜勿怖勿視當自然消滅始契至妙若以一妙散之衆妙曰玄牝曰鈆汞曰斤两曰火候曰結胎出胎等有種種假名各有種種竒說苟悟以衆妙攝于一妙一尚非一衆曷為衆咸泯之于自然之中咸無衆名咸具衆用魏伯易云委志歸虗無證騐自推移以舊鄭定夲為正今盡改作證難以推移者誤正此㫖也以浮㳺而守于規中抑其次焉是故神仙之道無他一自然之妙而已矣必先絶其思慮若渾忘于晝夜静極于極静極静于静極自然其清浄清浄其自然自然冥身心于空空而不昧自然藏乾坤于玄玄而不漏自然返夲還源自然月滿精盛自然當大造化一陽将動未動之𥘉我身中深深深極之根自然出獻甚玄甚妙甚㣲甚真之先天陽精以為丹毋自然通于任督湧泉同時互相淫淫𦦨𦦨沸發真熱捧擁丹母升上降下交貫周流以大造化大妙一身自然媾孕于其中自然凝而為長生不死純陽之寳動其自然之動而不動其自然之不動則動者以無動而動悠久綿宻秋毫不差自然成就于無終始之始終其心不死决不成道以我自然聼其自然純是真心自然其然不渉人私而㺯天玄此者誰也誰其此也萬偽皆壊獨此不壊一切皆真萬象自靈妙潜于至深清徹于極圎酩酊渾沌之髓而常吹古馨玲瓏金玉之體而獨抱空堅化其所化化為至化清風白雲同一去来出沒天無根而根于天地無蔕而蔕于地人無心而心于人三者雖不同道而同于道道而同之則與之同逰于無何有之或焉神其無形之形而出似乎聞太空有聲大呌世人曰汝等何為昏醉不醒邪有欲應之者已挟之出六合而去寕有蹤迹與世人見之人也世間道院豈能延之設造竒特華䴡道院過数百所不如以一點真心盡情供飬一切道人盡力利益一切衆生若以此為道院始入神仙境界敢以我夙誓真心盡誠吐露向者所参道家精藴冐禁破戒説而為文平等供飬十方三世一切神仙一切道人一切世人願一一先以徳行為夲仍以此道夀其自然清浄之天終以此道同挟乎天地人而同超于無無有有有無無有之表豈不了其無所了之了而了也邪遂以此文曰十方道院雲堂記十方禪刹僧堂記我三十年来幅巾藜杖獨行獨住獨坐獨卧獨吟獨醉獨徃獨来古闔廬城每一至于萬夀承天虎丘諸禪刹之間必喟然嘆曰我生也晚惜乎不見古尊宿法席隆盛之時向者徑山靈隱天童净慈育王中竺雪峰雪竇蔣山道塲䏻仁東林仰山黄龍開先百丈㕠林鼓山大溈石霜西禪保寕踈山金山焦山何山夾山福嚴圓通江心大慈華藏名刹百餘皆為法窟大刹禅单近千数小刹禅单亦不少凢古尊宿之行道也一語一黙一動一静無非舉唱向上巴鼻了當衲子命根多有死其心于一坐宴間而笑罵于佛祖之上者如在世外受清浄福自不肯飲酒自不肯茹腥自不肯私庖私啖自不肯私冨私居自不肯傲慢恣縦所為野氣如一水庵岳松源冲癡絶範無凖觀月林開無門諸老禪據師位皆孤硬有悪辣手皆講叢林規矩不許看經看冊不許偶語雜事晝夜趺坐宻如列筍盡命参䆒咸有覺觸是以頗多龍象堪以負荷法門夫何今者爐冷鎚輕不足以煆煉法器飯糲食悪不足以供飬大衆常住昧於収支過于撙莭幹衲子口中食為嚢槖計為結托計為自醉醲飽鮮計比比皆然致使十方衲子東馳西赱竟無可放包參請之地昔不憂飯今憂無飯昔不憂師今憂無師江南禅教諸刹連年遭水遭荒常住逋訟窘廹處處閉僧堂併数年可去者去不可活者丐借獨爨偷救殘命如失母児無所依附先是三十年来争奪住持耗常住竭私蓄㺯貧買勝無辜争訟亦多摧挫費耗失傳儀落業共撥因果大為時俗變壊江南十方叢林古意今盡不存竟無十方夲色衲子處處僧亦皆少逆料此後法門愈其難矣世人意馬悪業易于跌蕩後于薙髪背古悅新競舞魔怪叛于正法我欲痛説不忍茟之昔黄面老子嘗懸記末法僧門流弊不幸身親見此間有清素純正辦道之士叱為怪物罵之何苦自取桎梏其身苦者益苦頗難于獨立堅抱舊心固無揺動彼偷心未歇者亦從而淂志逞盲辨以當宗乗笑守古戒為不脫灑自誑自尊鼓無明火入骨愛財冨者愈冨念念謀僧官買大住持营私室為俗窟生親子為徒弟業重魔熾浮于俗人苦㢤痛哉絶不念黄面老子正爲何事出世百丈禅師亦何爲而作僧堂爰自少室曹溪多居律寺别院說法尚苟簡雜居無倫唐代宗末百丈始彂廣大心别創禅居立法堂立僧堂又置十務以處主事者清規一出法度咸新素無蒙堂無前資無单寮無退居方丈無塔頭菴院其曰禅僧無髙下但依入堂次苐同一堂而處進則始岀位盡力爲衆退則仍屈已棲身于衆三條椽下七尺单前一切不顧寕肯犯人苗稼爲衆所擯笑又况可丈以前天下苦無多寺院而辦道之士多無地棲禅率是獨隱深山窮谷刀耕火種而自食其力身其勞苦則心不純一豈不願淂一單如将安其身而逺于役可移其心而專于道百丈之恵可謂至矣有志氣者可以安禅可以共住可以同參可以交相淬礪可以交相鼓唱可以交相行道照耀山林大衆羣然一時一一坐破蒲團我心亦足慶快我成道大衆不成道我不願獨先成道我安大衆不安我决不敢獨安昔創此僧堂為大衆設非使我獨安于辦道也安其身所以安其心安其心所以安其道茍不安于道則不安于心不安于心則不安于身不安于身則心生萬夢失却自巳何以為佛法棟梁何以為衆生表率僧固亦人也為其清净慈悲了逹自心而淂僧之名若以落鬚髪披袈裟為僧九間萬椽為僧堂此世間見也誠不曾聞徃昔之時千岩萬壑之中古尊宿行道之處萬錫飛来如龍赱空雖現頭角不露爪甲劃破虗廓别為一道不涉世人衆生行處萬刹日月出沒其中八面風雲變化于外無所之所不住而住争奈有目者不能見有足者莫䏻入是誰之過與倘能飽食終日無所用其心恐亦可以消檀施一盂飯然未廣大也必有大心大士與大衆同生死同粥飯同行住坐卧同開此心夲然無盡廣大之天一一盡葢覆三千大千世界方始與黄面老子吐一口氣何期末法叢林凋零若此思之駭然安淂不涙下如雨我老矣死矣誓當重出頭来以大力量于無盡無盡百千萬億大衆僧海中推出無量無量刼前古佛剖開自心無盡廣大法門大告報一一無盡衆生塵刹一一三千大千世界若是大心大士便請各各歸堂去快㢤快哉苐佛法至此亟矣必先速淂数十人肉身大士大闡神通應化天下諸刹使一切衲子外不壊于一毫賄賂酷虐内不犯于一塵淫殺貪傲其不遵黄面老子遺教經最後教誨之意者不淂名曰僧然後却與之論世尊拈花迦葉㣲笑之宗風佛法其興乎我今苦吿諸佛子各各逑入大囘心三昧但言之至此我亦㒺知所措諸佛菩薩寕不動心焉我遂嘔我心中無忱聲而為誓銘之曰十方禪刹僧堂記鄭所南小傳鄭思肖字憶翁號所南福之連江透鄊人也祖咸卒于枝江縣主簿父震字叔𧺫號菊山淳祐道學君子為和靖書院山長景定壬戍卒于吴葬長洲縣甑山母楼氏妹為比丘尼名普西公太學上舎應博學宏詞科侍父来吴寓條坊巷元兵南下扣閽上太皇太后㓜主䟽辭切直忤當路不報初諱某宋亡乃改今名思肖即思趙憶翁與所南皆寓意也素不娶孑然一身念念不忘君形于言詩文中如過徐子方書塾云不知今日月但夢宋山川題鄭子封寓舎云此世但除君父外不曾别受一人㤙寒菊云寕可枝頭抱香死何曾吹落北風中贈人云天下皆變吾觀其不變惟其不變乃所以變其變者物也不變者道又云古人重立身今人重飬身立身者葢超乎千古之上與天地同流于不知不識之天也飬身者惜一粟以活㣲命役于萬物死于萬變者也何足道㢤遇歲時伏臘輙野哭南向拜人莫測識焉聞北語必掩耳亟走人亦知其孤僻不以爲異也坐卧不向北扁其室曰夲穴卋界以夲字之十置下文則大宋也精墨蘭自更祚後爲蘭不畫土根無所慿藉或問其故則云地爲畨人奪去汝猶不知邪不欲與雖廹以權勢不可淂也天目夲中峯禅林之白睂聞公名欲見未果偶㑹于孝子梅應彂家一見各黙不語坐久之本忽謂所南何不說法曰两眼對两眼無法可說及别去本又云博學老子公即曰世法和尚趙子昻才名重當世公悪其宗室而受元聘遂絶之子昻數徃候之終不淂見嘆息而去無何貨其所居淂錢則週人之急田亦捨諸刹惟餘数畆為衣食資語佃客曰我死則汝主之葢不以家為矣自是無定跡吴之名山禅室道宫無不遍厯多寓城之萬夀覺報二刹疾亟時嘱其友唐東嶼曰思肖死矣煩為書位牌當云大宋不忠不孝鄭思肖語訖而絶年七十八葢公之意謂不能死國與無後也自賛其像曰不忠可誅不孝可斬可懸此頭于洪洪荒荒之表以為不忠不孝之榜様宋社既墟適意緇黄自稱三外野人嘗著大無工十空經一卷空字去工而加十宋字也寓為大宋經造語竒澁如廋詞莫可曉自題其後云臣思肖嘔三斗血方能書此後當有具眼識之又著釋氏施食心法一卷太極祭煉一卷謬餘集一卷文集一卷自叙一百二十圗詩一卷與菊山先生詩集并行于世題鄭所南行錄後右所南先生行實一卷吴門唐謙自牧所纂錄也錄成以示予予讀之至其末云公之行尚矣惜無人為作傳姑記其㮣如此因歎曰自牧之錄此其有関于世教㢤葢先生亡國一太學生耳非有官守言責而享祿位之崇也顧其不屈也若是則夫受國㤙承顧託乃俯首帖耳若無所與而諉曰運数有歸者獨何心㢤先生遂至于終身坐卧未嘗北向則其秋霜烈日之難犯者盖凛乎其不可向邇矣故其殁也平日之靦然自欺而不能無愧畏于先生者方自慶幸又烏肯執筆以發揮之也㢤此先生之髙節峻行所以日逺而日忘也今自牧乃䏻于萹章殘廢之餘故老凋零之緒掇拾纂綴淂不至于盡泯而其賢不肖用心之不同于此可見矣嗚呼使伯夷之風不聞于後世頑夫安淂而亷懦夫安淂而立㢤予故曰自牧之錄此有関于世教也歲癸夘三月姑蘓王行書題周草窓畫像卷宋運既徂吴有三山鄭所南先生杭有弁陽周草窓先生皆以無所責守而志莭不屈著稱前二十年時獲瞻所南先生立像于吴門唐氏所南孤劲嚴峭有凛然不可犯之色觀其終身未嘗北向而坐可㮣見焉今獲瞻草窓先生像于長洲沈氏草窓豪偉逸秀有飄飄邁俗之氣觀其自賛之辭可㮣見焉二先生姿韵雖殊要皆介然特立足以増亡國之光者矣晚生後學不淂親接其言辭風範于當時乃獨于其遺像以想見其人可勝歆慕也㢤沈氏字伯凝家多法書名迹而尤寳蔵此卷云重光作噩良月丙午望王行書𥙷遺題畫蘭丙午正月十五日作此一卷向来俯首問羲皇汝是何人到此鄊未有畫前開鼻孔滿天浮動古馨香附錄題詠題鄭所南宅王賓自從宋鼎𬒳遷移此宅飄零棄與誰人問先生垂涙荅國亡何用念家為題宋太學鄭上舎墨蘭有序王逢公諱思肖字所南肖與南何居義不忘趙北面他姓也世家三山曽大父咸仕宋父起湻祐道學君子公太學上舎應博學宏詞科㑹元兵南叩闕上宋太皇幼主䟽不報國𥘉諸父老猶能記誦之語切直犯新禁俗以是争目公公遂變今名隠吴下所居蕭然坐必南向遇歲時伏臘輙野哭南向拜而返人莫測識焉有田三十畝邑宰素聞公精墨蘭不妄與人因紿以賦役取之公怒曰頭可淂蘭不可淂宰竒而釋之又嗜詩題蘭云玉佩凌風挽不囘暮雲長合椘王臺青春好在幽花裏招淂香從茟硯来過徐子方書塾云天垂古色照柴門昔日傳家事具存此世但除君父外不曾别受一人㤙寒菊云寕可枝頭抱香死何曽吹落北風中禦寒不藉水為命去國自同金鑄心其為文􅍾行率類此晚年益䆒天人性命之學竟以夀終舊傳獨行老康成文物衣冠魯両生甘與秦民潜避世恥為殷士祼如京天池水淺鯤南息衡岳峰髙雁北征三百運終遺墨在秋風九畹不勝情陳深芳草渺無尋處夢隔湘江風雨翁還間作椘花我亦為翁椘舞中吴王育所南老翁磊落人胸底飽含萬刼春吐出必湏作怪異聚空削有還强陳撮山揑雲欲隱䄂争自両手無力空張唇歸来垂頭黙無語戄然捉淂身内神從此縦横踏天地顛狂濶歩誰能倫倒拂溪藤直畫蘭花𬗋葳𬎼香可飡清風無塵烟霞翠月白凝秋半夜寒入夢迷人燕如醉相逢援琹愁對嘆老翁不見今何在忍看遺墨眉皺攅人亦香兮蘭亦香相思脉脉欲㫁腸雲開山阿見圭璧風散群飛聞鳯凰長使逍遥不拘束與蘭千載共幽芳烈哲雨過春山曉雲歸空谷香靈均不可見惆悵對幽芳餘澤南子毫端有古香不求或與意尤長如今好事非前軰祗愛昌陽掛屋梁曾㳺澧上過湘中祗見葩作小􅓜近日靈均生意轉從千畆媚春風魏俊民南望湘江歌椘聲癯癯鶴骨老山林濡毫為染萇弘血澹掃幽芳寄此心卧龍山人陳昱家學相承寳祐年東籬㡬度菊花天𬗋茎孤葉留殘墨更覺秋光分外妍遂昌鄭元祐南冠江上哭湘絫涙著幽蘭雨裡枝不獨萇弘血化碧孤芳愁絶有誰知屠澤釋徳欽君子譬如蘭在谷所翁淂之香可掬湘江浩動波濤空月落蒼梧滿秋屋王冕鄭所南胸次不凢文章學問有古人風度不偶陳跡𥿄上幽芳見是人韓奕惟公生南椘侍父来吴中身遭宋國亡耿耿懐孤忠無家又無後南冠號北風洒淚冩離騷咄咄如書空幽花間踈葉孤生不成叢翛然数花間遺恨自無窮圗成綴新語語怪誰能通流落為世重心苦寕論工此花有時盡此恨無時終吁嗟匹夫心所受由天衷我思殷頑民千古将無同口白晝呌不醒徒爾打筋斗若欲了此意但飲一杯酒晚年闔閭國僑寓陋巷屋屋中無所有事事不具足終不借人口伸舌覔飯喫以此大恣縦罵人笑吃吃山中一溪水絶與衆水别不解飲清風只觧醉明月一片清泠意活動流不徹何勞濯纓人再三苦饒舌我家南山南日月最相愛清光潑面来只是無人買我昔買淂之翻手恣買賣山北諸草木也只得禮拜佯狂真佯狂踏碎東風影一任東風吹花意亂不㝎閙閙人叢中人人喚不應借問老先生莫教是姓鄭頭戴爛紗巾脚踏破鞋底不知以何道琮琤宇宙裏或恐是逹人毋乃是癡子我亦欲問之面冷似鐡鬼我有一句子朗朗最分明問水水亦笑問石石亦嗔獨有老枯樹聞之彌精神從此開笑面惱殺天下人崛强数十年只㺯一枝茟茟是無根花日月常結實千千萬萬顆顆顆如紅日日日採将来布施十方佛蒼蠅亦奇㢤腹内矢何物黒者變為白白者變為黑不換人活眼何以化流俗我来閻浮提却喜無此術一火陶鑄来莫不皆完具豈有一造化而勞别父母可憐生盲者當面不辨主此理甚無斁唾汝化為土不怕明日死且喜今日活拍響浪𫾣擊飛謔訊挑撻直送㕠眼去天外破毫末盧都横上唇口門八寸濶三三即九九数之何曾有九九非三三拈来不用参滿頂髪䰐鬖滿面骨巖巉不知死日至只是弄癡憨巉巉巖谷中盡謂是白石一見一摩挱老眼滴寒碧絶無一點香蒼頂直堅立當道横黄金惜㢤無人識呌笑舞荒唐面上生雪霜一味呵呵笑赤脚赱四方明月忽見憎憎我太枯清我亦罵明月罵月㺯光明每愛入㴱山最怕石路悪剖樹斫木屐堅欲䕶㕠脚即忙著将来歩步革落落從教世上人罵我錯錯錯二十餘年来非不喜飲酒近日青天癡也逐世人赱罵詈古氷雪讃歎新花桞安淂不獨行鼻角挿入口飄飄山中行與雲同出没飢来餐生石入口細無骨滿吻流甘香不嚼而味出幽禽獨賞音数聲不可忽生来好苦吟與天争意氣自謂李杜生當趋下風避而今吾老矣無力收鼻涕非惟不成文抑且錯冩字昔者所讀書皆已束髙閣只有自是經今亦俱忘却時乎歌一拍不知是誰作慎勿錯聼之也且用不着突然出身來撥却青天轉擊破古洪濛碎作七八片片片生春風散作花桞面面面冷眼笑何處不相見頑絶絶頑絶以笑為生業剛道黑如炭誰知白似雪笑殺娑婆児盡逐光影㓕若無八角眼豈識四方月呌賣沒底有有價不敢道拾淂一塊泥勝如萬塊寳如此至鶻突直是不老艸逄人但點頭好好好好好何待死方休即今骨已朽竒特動天地也擲向背後咄這臭矢嚢恣情開大口幾翻說淂風驚落虗空赱
