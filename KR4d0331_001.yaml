front:
  text: 三山鄭菊山先生清雋集序雋粗兖切儒有古君子之風始可以曰儒儒非止于文章之謂文章者所以發揚其實詣而著見于實理也豈可空有其名㢤鄭菊山先生盖抱其實而當其名者也在昔林鬳齋周伯弜行軰當時人物林林焉如龍虎不可測如鳯凰不可覩非有以自植立于天地間何以與諸公相参錯照耀一世豪傑之耳目邪曩聞先兄秋堂先生望曰先生人物昻然氣節挺然議古喻今無不的當惜不見用于時然所言皆正大所守甚清苦其古君子與早年逰亰師即有聲晚年嘗主安定和靖二書院講明道學學者益尊敬後註易将脫稿而逝頗多雜著文章有詩曰􅌒逰稿今山村仇君摭四十首曰清雋集遂冠于所南翁一百二十圗詩之首庶幾知有所本橋梓輝映抑亦俱有光焉菊山先生諱震字叔起福州連江透鄊人慶元已未生景定壬戌卒葬于吴中甑山所南翁名思肖字憶翁併序及之大徳五年後學鄱陽道約柴志道序三山鄭菊山先生清雋集所南翁一百二十圗詩附
  hash: sha256:bacbd7755190e09f375b803259351bedca2edd3b83844627de90be88703e618b
